<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全国游客热力图 - 河伯所·古滇探秘</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    .china-map {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      background: #3d3228;
      border-radius: 12px;
      overflow: hidden;
    }
    .china-map svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .heat-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .heat-point {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">河伯所</span>
        </div>
        <div class="user-area">
          <button class="user-btn" id="userBtn" onclick="handleUserAction()">登录</button>
        </div>
      </div>
    </header>

    <div class="heatmap-container">
      <div class="game-header">
        <h1 class="game-title-header">全国游客热力图</h1>
      </div>

      <p style="color: var(--secondary-yellow); margin-bottom: 16px; font-size: 0.9rem;">
        查看来自全国各地游客的分布情况
      </p>

      <div class="china-map">
        <svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4a4035" stroke-width="0.5"/>
            </pattern>
            <radialGradient id="heat1" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:#ff4500;stop-opacity:0.8"/>
              <stop offset="40%" style="stop-color:#ff8c00;stop-opacity:0.4"/>
              <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
            </radialGradient>
            <radialGradient id="heat2" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:#ff6347;stop-opacity:0.7"/>
              <stop offset="50%" style="stop-color:#ffa500;stop-opacity:0.3"/>
              <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0"/>
            </radialGradient>
            <radialGradient id="heat3" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:#ff7f50;stop-opacity:0.6"/>
              <stop offset="60%" style="stop-color:#ffb347;stop-opacity:0.2"/>
              <stop offset="100%" style="stop-color:#ffff99;stop-opacity:0"/>
            </radialGradient>
          </defs>
          
          <!-- 海洋背景 -->
          <rect width="800" height="560" fill="#2a5a7a"/>
          
          <!-- 中国地图轮廓 -->
          <path d="M320,50 L380,45 L420,60 L470,50 L500,80 L530,70 L560,100 L580,90 L600,120 L585,140 L555,130 L535,160 L505,150 L485,180 L455,170 L435,200 L405,190 L385,220 L355,210 L335,240 L305,230 L285,260 L255,250 L235,280 L205,270 L185,300 L175,290 L185,265 L225,230 L265,205 L300,185 L320,170 L340,150 L360,135 L380,120 L400,105 L420,90 L440,75 L460,60 L440,50 L400,60 L360,70 L340,85 L330,75 L320,60 Z
                    M320,50 L280,65 L240,85 L200,105 L160,130 L120,160 L80,200 L60,240 L70,280 L90,320 L110,360 L130,400 L150,440 L170,480 L190,520 L210,560 L230,600 L250,640 L270,680 L290,720 L310,760 L330,800 L350,840 L370,880 L390,920 L410,960 L430,1000 L430,1005 L450,1000 L470,995 L490,990 L510,985 L530,980 L550,975 L570,970 L590,965 L610,960 L630,955 L650,950 L670,945 L690,940 L710,935 L730,930 L750,925 L770,920 L790,915 L810,910 L830,905 L850,900 L870,895 L890,890 L910,885 L930,880 L950,875 L970,870 L990,865 L995,845 L990,825 L985,805 L980,785 L975,765 L970,745 L965,725 L960,705 L955,685 L950,665 L945,645 L940,625 L935,605 L930,585 L925,565 L920,545 L915,525 L910,505 L905,485 L900,465 L895,445 L890,425 L885,405 L880,385 L875,365 L870,345 L865,325 L860,305 L855,285 L850,265 L845,245 L840,225 L835,205 L830,185 L825,165 L820,145 L815,125 L810,105 L805,85 L800,65 L795,45 L790,35 L770,45 L750,55 L730,65 L710,75 L690,85 L670,95 L650,105 L630,115 L610,125 L600,120 L580,90 L560,100 L530,70 L500,80 L470,50 L420,60 L400,50 L380,45 L340,45 L320,50 Z"
                fill="#f5f0e6" stroke="#c9b896" stroke-width="1.5"/>
          
          <!-- 台湾岛 -->
          <path d="M720,230 L760,220 L780,250 L770,280 L740,300 L720,280 L710,250 Z"
                fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
          
          <!-- 海南岛 -->
          <path d="M500,410 L530,400 L540,430 L530,460 L500,480 L480,460 L470,430 Z"
                fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
          
          <!-- 热力图热点 -->
          <!-- 京津冀地区 -->
          <circle cx="580" cy="200" r="80" fill="url(#heat1)"/>
          <!-- 长三角地区 -->
          <circle cx="620" cy="280" r="90" fill="url(#heat1)"/>
          <!-- 珠三角地区 -->
          <circle cx="600" cy="380" r="85" fill="url(#heat1)"/>
          <!-- 成渝地区 -->
          <circle cx="450" cy="350" r="70" fill="url(#heat2)"/>
          <!-- 武汉周边 -->
          <circle cx="520" cy="320" r="65" fill="url(#heat2)"/>
          <!-- 西安地区 -->
          <circle cx="420" cy="250" r="60" fill="url(#heat2)"/>
          <!-- 沈阳地区 -->
          <circle cx="700" cy="160" r="55" fill="url(#heat3)"/>
          <!-- 郑州地区 -->
          <circle cx="510" cy="270" r="50" fill="url(#heat3)"/>
          <!-- 长沙地区 -->
          <circle cx="530" cy="350" r="50" fill="url(#heat3)"/>
          <!-- 杭州地区 -->
          <circle cx="640" cy="270" r="50" fill="url(#heat3)"/>
          <!-- 昆明地区 -->
          <circle cx="420" cy="430" r="45" fill="url(#heat3)"/>
          <!-- 兰州地区 -->
          <circle cx="350" cy="280" r="40" fill="url(#heat3)"/>
          <!-- 乌鲁木齐地区 -->
          <circle cx="200" cy="180" r="45" fill="url(#heat3)"/>
          <!-- 哈尔滨地区 -->
          <circle cx="680" cy="100" r="40" fill="url(#heat3)"/>
          <!-- 福州地区 -->
          <circle cx="660" cy="330" r="35" fill="url(#heat3)"/>
          
          <!-- 城市标注 -->
          <text x="580" y="195" font-size="10" fill="#8b7355" text-anchor="middle">北京</text>
          <text x="625" y="275" font-size="10" fill="#8b7355" text-anchor="middle">上海</text>
          <text x="595" y="375" font-size="10" fill="#8b7355" text-anchor="middle">广州</text>
          <text x="445" y="345" font-size="10" fill="#8b7355" text-anchor="middle">成都</text>
          <text x="415" y="245" font-size="10" fill="#8b7355" text-anchor="middle">西安</text>
        </svg>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-color" style="background: radial-gradient(circle, #ff4500 0%, #ff8c00 50%, transparent 100%); width: 40px; height: 40px; border-radius: 50%;"></div>
          <span>密集</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: radial-gradient(circle, #ff6347 0%, #ffa500 50%, transparent 100%); width: 35px; height: 35px; border-radius: 50%;"></div>
          <span>较多</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: radial-gradient(circle, #ff7f50 0%, #ffb347 50%, transparent 100%); width: 30px; height: 30px; border-radius: 50%;"></div>
          <span>一般</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: radial-gradient(circle, #ffaa00 0%, #ffd700 50%, transparent 100%); width: 25px; height: 25px; border-radius: 50%;"></div>
          <span>较少</span>
        </div>
      </div>

      <div class="stats-panel">
        <h3 class="stats-title">📊 游客统计</h3>
        <div class="stats-total">
          <div class="stats-number" id="totalVisitors">2,951</div>
          <div class="stats-label">总访客数</div>
        </div>
        <ul class="ranking-list" id="rankingList">
          <li class="ranking-item">
            <span class="ranking-rank">1</span>
            <span class="ranking-province">北京</span>
            <span class="ranking-count">523</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-rank">2</span>
            <span class="ranking-province">上海</span>
            <span class="ranking-count">486</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-rank">3</span>
            <span class="ranking-province">广州</span>
            <span class="ranking-count">412</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-rank">4</span>
            <span class="ranking-province">成都</span>
            <span class="ranking-count">356</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-rank">5</span>
            <span class="ranking-province">深圳</span>
            <span class="ranking-count">298</span>
          </li>
        </ul>
      </div>

      <p style="color: var(--secondary-yellow); margin-top: 16px; font-size: 0.85rem; text-align: center;">
        数据基于用户注册信息统计 · 热点区域表示游客密度
      </p>
    </div>

    <a href="index.html" class="back-link" style="margin-top: 24px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回首页
    </a>
  </div>

  <script>
    function getUserInfo() {
      const data = localStorage.getItem('heboUser');
      return data ? JSON.parse(data) : null;
    }

    function updateUserButton() {
      const user = getUserInfo();
      const userBtn = document.getElementById('userBtn');
      if (userBtn) {
        if (user) {
          userBtn.textContent = user.username;
          userBtn.onclick = () => {
            if (confirm('确定要退出登录吗?')) {
              localStorage.removeItem('heboUser');
              updateUserButton();
              showToast('已退出登录');
            }
          };
        } else {
          userBtn.textContent = '登录';
          userBtn.onclick = () => window.location.href = 'auth.html';
        }
      }
    }

    function handleUserAction() {
      const user = getUserInfo();
      if (user) {
        if (confirm('确定要退出登录吗?')) {
          localStorage.removeItem('heboUser');
          updateUserButton();
          showToast('已退出登录');
        }
      } else {
        window.location.href = 'auth.html';
      }
    }

    function showToast(message) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    document.addEventListener('DOMContentLoaded', updateUserButton);
  </script>
</body>
</html>
