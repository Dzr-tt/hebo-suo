<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国游客热力图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #2d241c; 
      min-height: 100vh; 
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #d4af37; text-align: center; margin-bottom: 16px; }
    .china-map { 
      background: #3d3228; 
      border-radius: 12px; 
      overflow: hidden;
      margin-bottom: 20px;
    }
    .china-map svg { width: 100%; height: auto; }
    .legend { 
      display: flex; 
      justify-content: center; 
      gap: 24px; 
      margin-bottom: 20px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; color: #d4af37; font-size: 14px; }
    .legend-color { border-radius: 50%; }
    .stats-panel { 
      background: #3d3228; 
      border-radius: 12px; 
      padding: 20px; 
      color: #d4af37;
    }
    .stats-title { margin-bottom: 16px; }
    .stats-total { text-align: center; margin-bottom: 16px; }
    .stats-number { font-size: 36px; font-weight: bold; }
    .stats-label { font-size: 14px; opacity: 0.8; }
    .ranking-list { list-style: none; }
    .ranking-item { 
      display: flex; 
      justify-content: space-between; 
      padding: 8px 0; 
      border-bottom: 1px solid #4a4035;
    }
    .back-link { 
      display: block; 
      text-align: center; 
      color: #d4af37; 
      margin-top: 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>全国游客热力图</h1>
    
    <div class="china-map">
      <svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="heatA" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff4500;stop-opacity:0.8"/>
            <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:0.3"/>
            <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="heatB" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff6347;stop-opacity:0.7"/>
            <stop offset="55%" style="stop-color:#ffa500;stop-opacity:0.25"/>
            <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="heatC" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff7f50;stop-opacity:0.5"/>
            <stop offset="60%" style="stop-color:#ffb347;stop-opacity:0.2"/>
            <stop offset="100%" style="stop-color:#ffff99;stop-opacity:0"/>
          </radialGradient>
        </defs>
        
        <!-- 海洋背景 -->
        <rect width="900" height="600" fill="#1e3d5c"/>
        
        <!-- 中国地图 -->
        <path d="M220,60 L280,55 L320,75 L370,65 L400,95 L430,85 L460,115 L480,105 L500,135 L485,155 L455,145 L435,175 L405,165 L385,195 L355,185 L335,215 L305,205 L285,235 L255,225 L235,255 L205,245 L185,275 L175,265 L185,240 L225,205 L265,180 L300,160 L320,145 L340,125 L360,110 L380,95 L400,80 L420,65 L440,50 L420,40 L380,50 L340,60 L320,75 L310,65 L290,50 L260,60 L220,80 L200,95 L180,115 L160,140 L140,170 L120,210 L100,260 L105,290 L125,340 L145,390 L165,440 L185,490 L205,540 L225,590 L245,640 L265,690 L285,740 L305,790 L325,840 L345,890 L365,940 L380,970 L400,975 L450,965 L500,955 L550,945 L600,935 L650,925 L700,915 L750,905 L800,895 L850,885 L880,880 L895,880 L890,860 L875,820 L855,770 L835,720 L815,670 L795,620 L775,570 L755,520 L735,470 L715,420 L695,370 L675,320 L655,270 L635,220 L615,170 L595,120 L575,95 L555,105 L535,85 L505,95 L475,65 L435,75 L415,55 L395,60 L375,40 L335,45 L315,55 L295,40 L255,50 L225,65 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1.5"/>
        
        <!-- 台湾岛 -->
        <path d="M720,280 L760,270 L780,300 L770,330 L740,350 L720,330 L710,300 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 海南岛 -->
        <path d="M500,500 L530,490 L540,520 L530,550 L500,570 L480,550 L470,520 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 热力热点 - 高密度 -->
        <circle cx="580" cy="180" r="90" fill="url(#heatA)"/>
        <circle cx="640" cy="280" r="100" fill="url(#heatA)"/>
        <circle cx="620" cy="400" r="95" fill="url(#heatA)"/>
        
        <!-- 热力热点 - 中密度 -->
        <circle cx="450" cy="380" r="75" fill="url(#heatB)"/>
        <circle cx="530" cy="340" r="70" fill="url(#heatB)"/>
        <circle cx="420" cy="260" r="65" fill="url(#heatB)"/>
        
        <!-- 热力热点 - 低密度 -->
        <circle cx="700" cy="160" r="55" fill="url(#heatC)"/>
        <circle cx="510" cy="280" r="50" fill="url(#heatC)"/>
        <circle cx="540" cy="370" r="50" fill="url(#heatC)"/>
        <circle cx="660" cy="270" r="50" fill="url(#heatC)"/>
        <circle cx="420" cy="450" r="45" fill="url(#heatC)"/>
        <circle cx="350" cy="280" r="40" fill="url(#heatC)"/>
        <circle cx="200" cy="180" r="45" fill="url(#heatC)"/>
        <circle cx="680" cy="100" r="40" fill="url(#heatC)"/>
        <circle cx="680" cy="350" r="35" fill="url(#heatC)"/>
        
        <!-- 城市标注 -->
        <text x="580" y="175" font-size="11" fill="#8b7355" text-anchor="middle">北京</text>
        <text x="645" y="275" font-size="11" fill="#8b7355" text-anchor="middle">上海</text>
        <text x="615" y="395" font-size="11" fill="#8b7355" text-anchor="middle">广州</text>
        <text x="445" y="375" font-size="11" fill="#8b7355" text-anchor="middle">成都</text>
        <text x="415" y="255" font-size="11" fill="#8b7355" text-anchor="middle">西安</text>
      </svg>
    </div>
    
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="width: 40px; height: 40px; background: radial-gradient(circle, #ff4500 0%, #ff8c00 50%, transparent 100%);"></div>
        <span>密集</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 35px; height: 35px; background: radial-gradient(circle, #ff6347 0%, #ffa500 50%, transparent 100%);"></div>
        <span>较多</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 30px; height: 30px; background: radial-gradient(circle, #ff7f50 0%, #ffb347 50%, transparent 100%);"></div>
        <span>一般</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 25px; height: 25px; background: radial-gradient(circle, #ffaa00 0%, #ffd700 50%, transparent 100%);"></div>
        <span>较少</span>
      </div>
    </div>
    
    <div class="stats-panel">
      <h3 class="stats-title">📊 游客统计</h3>
      <div class="stats-total">
        <div class="stats-number">2,951</div>
        <div class="stats-label">总访客数</div>
      </div>
      <ul class="ranking-list">
        <li class="ranking-item"><span class="ranking-rank">1</span><span>北京</span><span>523</span></li>
        <li class="ranking-item"><span class="ranking-rank">2</span><span>上海</span><span>486</span></li>
        <li class="ranking-item"><span class="ranking-rank">3</span><span>广州</span><span>412</span></li>
        <li class="ranking-item"><span class="ranking-rank">4</span><span>成都</span><span>356</span></li>
        <li class="ranking-item"><span class="ranking-rank">5</span><span>深圳</span><span>298</span></li>
      </ul>
    </div>
    
    <a href="index.html" class="back-link">← 返回首页</a>
  </div>
</body>
</html>
