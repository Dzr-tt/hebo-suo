<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国游客热力图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #2d241c; 
      min-height: 100vh; 
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #d4af37; text-align: center; margin-bottom: 16px; }
    .china-map { 
      background: #1e3d5c; 
      border-radius: 12px; 
      overflow: hidden;
      margin-bottom: 20px;
    }
    .legend { 
      display: flex; 
      justify-content: center; 
      gap: 24px; 
      margin-bottom: 20px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; color: #d4af37; font-size: 14px; }
    .legend-color { border-radius: 50%; }
    .stats-panel { 
      background: #3d3228; 
      border-radius: 12px; 
      padding: 20px; 
      color: #d4af37;
    }
    .stats-title { margin-bottom: 16px; }
    .stats-total { text-align: center; margin-bottom: 16px; }
    .stats-number { font-size: 36px; font-weight: bold; }
    .stats-label { font-size: 14px; opacity: 0.8; }
    .ranking-list { list-style: none; }
    .ranking-item { 
      display: flex; 
      justify-content: space-between; 
      padding: 8px 0; 
      border-bottom: 1px solid #4a4035;
    }
    .back-link { 
      display: block; 
      text-align: center; 
      color: #d4af37; 
      margin-top: 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>全国游客热力图</h1>
    
    <div class="china-map">
      <svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="heat1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff4500;stop-opacity:0.8"/>
            <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:0.4"/>
            <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="heat2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff6347;stop-opacity:0.6"/>
            <stop offset="55%" style="stop-color:#ffa500;stop-opacity:0.3"/>
            <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="heat3" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff7f50;stop-opacity:0.5"/>
            <stop offset="60%" style="stop-color:#ffb347;stop-opacity:0.2"/>
            <stop offset="100%" style="stop-color:#ffff99;stop-opacity:0"/>
          </radialGradient>
        </defs>
        
        <!-- 中国地图 -->
        <path d="M180,60 L240,55 L290,75 L340,65 L370,95 L400,85 L430,115 L450,105 L470,135 L455,155 L425,145 L405,175 L375,165 L355,195 L325,185 L305,215 L275,205 L255,235 L225,225 L205,255 L195,245 L205,220 L245,185 L285,160 L310,145 L335,120 L365,95 L395,70 L425,45 L405,35 L365,45 L325,55 L305,70 L295,60 L275,45 L235,55 L195,75 L175,90 L155,115 L135,145 L115,185 L95,235 L100,270 L125,335 L155,410 L185,485 L215,560 L245,635 L275,710 L305,785 L335,860 L365,935 L375,955 L425,945 L480,935 L535,925 L590,915 L645,905 L700,895 L755,885 L810,875 L830,875 L815,830 L785,755 L755,680 L725,605 L695,530 L665,455 L635,380 L605,305 L575,230 L560,195 L555,205 L545,200 L535,205 L525,195 L515,200 L505,190 L495,195 L485,185 L475,190 L465,175 L435,185 L425,170 L405,175 L395,160 L385,165 L375,150 L335,155 L325,140 L285,150 L255,170 L235,190 L225,205 L215,195 L225,170 L265,135 L305,110 L330,95 L355,70 L335,60 L295,70 L255,90 L235,105 L215,125 L205,140 L195,130 L205,105 L245,70 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 台湾岛 -->
        <path d="M700,230 L735,220 L755,250 L745,280 L715,300 L695,280 L685,250 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 海南岛 -->
        <path d="M480,430 L510,420 L520,450 L510,480 L480,500 L460,480 L450,450 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 热力热点 -->
        <g class="heatmap-area">
          <ellipse cx="500" cy="240" rx="280" ry="200" fill="none" stroke="#ff6b35" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
        </g>
        
        <!-- 热力热点 - 高密度 -->
        <circle cx="500" cy="160" r="85" fill="url(#heat1)"/>
        <circle cx="555" cy="250" r="95" fill="url(#heat1)"/>
        <circle cx="540" cy="360" r="90" fill="url(#heat1)"/>
        
        <circle cx="390" cy="330" r="75" fill="url(#heat2)"/>
        <circle cx="470" cy="290" r="70" fill="url(#heat2)"/>
        <circle cx="360" cy="210" r="65" fill="url(#heat2)"/>
        
        <circle cx="640" cy="130" r="55" fill="url(#heat3)"/>
        <circle cx="450" cy="250" r="50" fill="url(#heat3)"/>
        <circle cx="480" cy="320" r="50" fill="url(#heat3)"/>
        <circle cx="580" cy="240" r="50" fill="url(#heat3)"/>
        <circle cx="380" cy="390" r="45" fill="url(#heat3)"/>
        <circle cx="290" cy="240" r="40" fill="url(#heat3)"/>
        <circle cx="140" cy="150" r="45" fill="url(#heat3)"/>
        <circle cx="620" cy="80" r="40" fill="url(#heat3)"/>
        <circle cx="630" cy="320" r="35" fill="url(#heat3)"/>
        
        <!-- 城市标注 -->
        <text x="500" y="155" font-size="11" fill="#6b5344" text-anchor="middle">北京</text>
        <text x="560" y="245" font-size="11" fill="#6b5344" text-anchor="middle">上海</text>
        <text x="535" y="355" font-size="11" fill="#6b5344" text-anchor="middle">广州</text>
        <text x="385" y="325" font-size="11" fill="#6b5344" text-anchor="middle">成都</text>
        <text x="355" y="205" font-size="11" fill="#6b5344" text-anchor="middle">西安</text>
      </svg>
    </div>
    
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="width: 40px; height: 40px; background: radial-gradient(circle, #ff4500 0%, #ff8c00 50%, transparent 100%);"></div>
        <span>密集</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 35px; height: 35px; background: radial-gradient(circle, #ff6347 0%, #ffa500 50%, transparent 100%);"></div>
        <span>较多</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 30px; height: 30px; background: radial-gradient(circle, #ff7f50 0%, #ffb347 50%, transparent 100%);"></div>
        <span>一般</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 25px; height: 25px; background: radial-gradient(circle, #ffaa00 0%, #ffd700 50%, transparent 100%);"></div>
        <span>较少</span>
      </div>
    </div>
    
    <div class="stats-panel">
      <h3 class="stats-title">📊 游客统计</h3>
      <div class="stats-total">
        <div class="stats-number">2,951</div>
        <div class="stats-label">总访客数</div>
      </div>
      <ul class="ranking-list">
        <li class="ranking-item"><span>1</span><span>北京</span><span>523</span></li>
        <li class="ranking-item"><span>2</span><span>上海</span><span>486</span></li>
        <li class="ranking-item"><span>3</span><span>广州</span><span>412</span></li>
        <li class="ranking-item"><span>4</span><span>成都</span><span>356</span></li>
        <li class="ranking-item"><span>5</span><span>深圳</span><span>298</span></li>
      </ul>
    </div>
    
    <a href="index.html" class="back-link">← 返回首页</a>
  </div>
</body>
</html>
