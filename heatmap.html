<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    .china-map svg {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">河伯所</span>
        </div>
        <div class="user-area">
          <button class="user-btn" id="userBtn" onclick="handleUserAction()">登录</button>
        </div>
      </div>
    </header>

    <div class="heatmap-container">
      <div class="game-header">
        <h1 class="game-title-header">全国游客热力图</h1>
      </div>

      <p style="color: var(--secondary-yellow); margin-bottom: 16px; font-size: 0.9rem;">
        查看来自全国各地游客的分布情况
      </p>

      <div class="china-map">
        <svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="heatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#1a5f4a"/>
              <stop offset="100%" style="stop-color:#b5d4a0"/>
            </linearGradient>
          </defs>
          <!-- 中国地图轮廓 -->
          <path d="M320,40 L380,35 L420,55 L470,45 L500,75 L530,65 L560,95 L580,85 L600,115 L585,135 L555,125 L535,155 L505,145 L485,175 L455,165 L435,195 L405,185 L385,215 L355,205 L335,235 L305,225 L285,255 L255,245 L235,275 L205,265 L185,295 L175,285 L185,260 L225,225 L265,200 L300,180 L320,165 L340,145 L360,130 L380,115 L400,100 L420,85 L440,70 L460,55 L440,45 L400,55 L360,65 L340,80 L330,70 L320,55 Z
                    M320,40 L280,60 L240,80 L200,100 L160,125 L120,155 L80,195 L60,235 L70,275 L90,315 L110,355 L130,395 L150,435 L170,475 L190,515 L210,555 L230,595 L250,635 L270,675 L290,715 L310,755 L330,795 L350,835 L370,875 L390,915 L410,955 L430,995 L450,990 L470,985 L490,980 L510,975 L530,970 L550,965 L570,960 L590,955 L610,950 L630,945 L650,940 L670,935 L690,930 L710,925 L730,920 L750,915 L770,910 L790,905 L810,900 L830,895 L850,890 L870,885 L890,880 L910,875 L930,870 L950,865 L970,860 L990,855 L995,835 L990,815 L985,795 L980,775 L975,755 L970,735 L965,715 L960,695 L955,675 L950,655 L945,635 L940,615 L935,595 L930,575 L925,555 L920,535 L915,515 L910,495 L905,475 L900,455 L895,435 L890,415 L885,395 L880,375 L875,355 L870,335 L865,315 L860,295 L855,275 L850,255 L845,235 L840,215 L835,195 L830,175 L825,155 L820,135 L815,115 L810,95 L805,75 L800,55 L795,35 L790,30 L770,40 L750,50 L730,60 L710,70 L690,80 L670,90 L650,100 L630,110 L610,120 L600,115 L580,85 L560,95 L530,65 L500,75 L470,45 L420,55 L400,45 L380,35 L340,35 L320,40 Z"
                fill="url(#heatGradient)" stroke="#2a2218" stroke-width="2"/>
          <!-- 台湾岛 -->
          <path d="M720,220 L760,210 L780,240 L770,270 L740,290 L720,270 L710,240 Z"
                fill="#4a9a6a" stroke="#2a2218" stroke-width="1"/>
          <!-- 海南岛 -->
          <path d="M500,400 L530,390 L540,420 L530,450 L500,470 L480,450 L470,420 Z"
                fill="#7cb880" stroke="#2a2218" stroke-width="1"/>
          <!-- 标注点 -->
          <circle cx="420" cy="180" r="5" fill="#FFD700"/>
          <circle cx="520" cy="280" r="4" fill="#FFD700"/>
          <circle cx="380" cy="350" r="4" fill="#FFD700"/>
          <circle cx="480" cy="380" r="4" fill="#FFD700"/>
        </svg>

        <div class="legend">
          <div class="legend-item">
            <div class="legend-color" style="background: #1a5f4a;"></div>
            <span>较少</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #4a9a6a;"></div>
            <span>一般</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #7cb880;"></div>
            <span>较多</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #b5d4a0;"></div>
            <span>密集</span>
          </div>
        </div>
      </div>

      <div class="stats-panel">
        <h3 class="stats-title">📊 游客统计</h3>
        <div class="stats-total">
          <div class="stats-number" id="totalVisitors">2,951</div>
          <div class="stats-label">总访客数</div>
        </div>
        <ul class="ranking-list" id="rankingList">
          <li class="ranking-item">
            <span class="ranking-rank">1</span>
            <span class="ranking-province">中国大陆</span>
            <span class="ranking-count">2,856</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-rank">2</span>
            <span class="ranking-province">台湾</span>
            <span class="ranking-count">52</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-rank">3</span>
            <span class="ranking-province">海南</span>
            <span class="ranking-count">43</span>
          </li>
        </ul>
      </div>

      <p style="color: var(--secondary-yellow); margin-top: 16px; font-size: 0.85rem; text-align: center;">
        点击地图查看详情 · 数据基于用户注册信息统计
      </p>
    </div>

    <a href="index.html" class="back-link" style="margin-top: 24px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回首页
    </a>
  </div>

  <script>
    function getUserInfo() {
      const data = localStorage.getItem('heboUser');
      return data ? JSON.parse(data) : null;
    }

    function updateUserButton() {
      const user = getUserInfo();
      const userBtn = document.getElementById('userBtn');
      if (userBtn) {
        if (user) {
          userBtn.textContent = user.username;
          userBtn.onclick = () => {
            if (confirm('确定要退出登录吗?')) {
              localStorage.removeItem('heboUser');
              updateUserButton();
              showToast('已退出登录');
            }
          };
        } else {
          userBtn.textContent = '登录';
          userBtn.onclick = () => window.location.href = 'auth.html';
        }
      }
    }

    function handleUserAction() {
      const user = getUserInfo();
      if (user) {
        if (confirm('确定要退出登录吗?')) {
          localStorage.removeItem('heboUser');
          updateUserButton();
          showToast('已退出登录');
        }
      } else {
        window.location.href = 'auth.html';
      }
    }

    function showToast(message) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    document.addEventListener('DOMContentLoaded', updateUserButton);
  </script>
</body>
</html>
