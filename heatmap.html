<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国游客热力图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #2d241c; 
      min-height: 100vh; 
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #d4af37; text-align: center; margin-bottom: 16px; }
    .china-map { 
      background: #1e3d5c; 
      border-radius: 12px; 
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }
    .china-map svg { width: 100%; height: auto; display: block; }
    .legend { 
      display: flex; 
      justify-content: center; 
      gap: 24px; 
      margin-bottom: 20px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; color: #d4af37; font-size: 14px; }
    .legend-color { border-radius: 50%; }
    .stats-panel { 
      background: #3d3228; 
      border-radius: 12px; 
      padding: 20px; 
      color: #d4af37;
    }
    .stats-title { margin-bottom: 16px; }
    .stats-total { text-align: center; margin-bottom: 16px; }
    .stats-number { font-size: 36px; font-weight: bold; }
    .stats-label { font-size: 14px; opacity: 0.8; }
    .ranking-list { list-style: none; }
    .ranking-item { 
      display: flex; 
      justify-content: space-between; 
      padding: 8px 0; 
      border-bottom: 1px solid #4a4035;
    }
    .back-link { 
      display: block; 
      text-align: center; 
      color: #d4af37; 
      margin-top: 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>全国游客热力图</h1>
    
    <div class="china-map">
      <svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="heat1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff4500;stop-opacity:0.8"/>
            <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:0.4"/>
            <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="heat2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff6347;stop-opacity:0.6"/>
            <stop offset="55%" style="stop-color:#ffa500;stop-opacity:0.3"/>
            <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="heat3" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff7f50;stop-opacity:0.5"/>
            <stop offset="60%" style="stop-color:#ffb347;stop-opacity:0.2"/>
            <stop offset="100%" style="stop-color:#ffff99;stop-opacity:0"/>
          </radialGradient>
        </defs>
        
        <!-- 中国地图主体 -->
        <path d="M250,50 L300,45 L350,65 L400,55 L430,85 L460,75 L490,105 L510,95 L530,125 L515,145 L485,135 L465,165 L435,155 L415,185 L385,175 L365,205 L335,195 L315,225 L285,215 L265,245 L235,235 L215,265 L205,255 L215,230 L255,195 L295,170 L320,155 L345,130 L375,105 L405,80 L435,55 L415,45 L375,55 L335,65 L315,80 L305,70 L285,55 L245,65 L205,85 L185,100 L165,125 L145,155 L125,195 L105,245 L110,280 L135,345 L165,420 L195,495 L225,570 L255,645 L285,720 L315,795 L345,870 L375,945 L385,965 L435,955 L490,945 L545,935 L600,925 L655,915 L710,905 L765,895 L820,885 L840,885 L825,840 L795,765 L765,690 L735,615 L705,540 L675,465 L645,390 L615,315 L585,240 L565,195 L545,205 L525,185 L495,195 L465,165 L425,175 L405,155 L385,160 L365,140 L325,145 L305,130 L265,140 L235,160 L215,180 L205,195 L195,185 L205,160 L245,125 L285,100 L310,85 L335,60 L315,50 L275,60 L235,80 L215,95 L195,115 L185,130 L175,120 L185,95 L220,70 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 台湾岛 -->
        <path d="M700,250 L735,240 L755,270 L745,300 L715,320 L695,300 L685,270 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 海南岛 -->
        <path d="M480,450 L510,440 L520,470 L510,500 L480,520 L460,500 L450,470 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 热力热点 - 高密度 -->
        <circle cx="520" cy="180" r="85" fill="url(#heat1)"/>
        <circle cx="575" cy="270" r="95" fill="url(#heat1)"/>
        <circle cx="560" cy="380" r="90" fill="url(#heat1)"/>
        
        <!-- 热力热点 - 中密度 -->
        <circle cx="410" cy="350" r="75" fill="url(#heat2)"/>
        <circle cx="490" cy="310" r="70" fill="url(#heat2)"/>
        <circle cx="380" cy="230" r="65" fill="url(#heat2)"/>
        
        <!-- 热力热点 - 低密度 -->
        <circle cx="660" cy="150" r="55" fill="url(#heat3)"/>
        <circle cx="470" cy="270" r="50" fill="url(#heat3)"/>
        <circle cx="500" cy="340" r="50" fill="url(#heat3)"/>
        <circle cx="600" cy="260" r="50" fill="url(#heat3)"/>
        <circle cx="400" cy="410" r="45" fill="url(#heat3)"/>
        <circle cx="310" cy="260" r="40" fill="url(#heat3)"/>
        <circle cx="160" cy="170" r="45" fill="url(#heat3)"/>
        <circle cx="640" cy="100" r="40" fill="url(#heat3)"/>
        <circle cx="650" cy="340" r="35" fill="url(#heat3)"/>
        
        <!-- 城市标注 -->
        <text x="520" y="175" font-size="11" fill="#6b5344" text-anchor="middle">北京</text>
        <text x="580" y="265" font-size="11" fill="#6b5344" text-anchor="middle">上海</text>
        <text x="555" y="375" font-size="11" fill="#6b5344" text-anchor="middle">广州</text>
        <text x="405" y="345" font-size="11" fill="#6b5344" text-anchor="middle">成都</text>
        <text x="375" y="225" font-size="11" fill="#6b5344" text-anchor="middle">西安</text>
      </svg>
    </div>
    
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="width: 40px; height: 40px; background: radial-gradient(circle, #ff4500 0%, #ff8c00 50%, transparent 100%);"></div>
        <span>密集</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 35px; height: 35px; background: radial-gradient(circle, #ff6347 0%, #ffa500 50%, transparent 100%);"></div>
        <span>较多</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 30px; height: 30px; background: radial-gradient(circle, #ff7f50 0%, #ffb347 50%, transparent 100%);"></div>
        <span>一般</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 25px; height: 25px; background: radial-gradient(circle, #ffaa00 0%, #ffd700 50%, transparent 100%);"></div>
        <span>较少</span>
      </div>
    </div>
    
    <div class="stats-panel">
      <h3 class="stats-title">📊 游客统计</h3>
      <div class="stats-total">
        <div class="stats-number">2,951</div>
        <div class="stats-label">总访客数</div>
      </div>
      <ul class="ranking-list">
        <li class="ranking-item"><span>1</span><span>北京</span><span>523</span></li>
        <li class="ranking-item"><span>2</span><span>上海</span><span>486</span></li>
        <li class="ranking-item"><span>3</span><span>广州</span><span>412</span></li>
        <li class="ranking-item"><span>4</span><span>成都</span><span>356</span></li>
        <li class="ranking-item"><span>5</span><span>深圳</span><span>298</span></li>
      </ul>
    </div>
    
    <a href="index.html" class="back-link">← 返回首页</a>
  </div>
</body>
</html>
