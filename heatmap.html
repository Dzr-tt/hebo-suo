<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全国游客热力图 - 河伯所·古滇探秘</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">河伯所</span>
        </div>
        <div class="user-area">
          <button class="user-btn" id="userBtn" onclick="handleUserAction()">登录</button>
        </div>
      </div>
    </header>

    <div class="heatmap-container">
      <div class="game-header">
        <h1 class="game-title-header">全国游客热力图</h1>
      </div>

      <p style="color: var(--secondary-yellow); margin-bottom: 16px; font-size: 0.9rem;">
        查看来自全国各地游客的分布情况
      </p>

      <div class="china-map">
        <svg class="map-svg" viewBox="0 0 900 750" id="chinaMap">
          <!-- 黑龙江省 -->

          <!-- 西藏自治区 -->
          <path class="province" id="xizang" data-name="西藏" data-count="0" d="M100,140 L160,160 L200,170 L220,210 L210,270 L160,290 L110,280 L70,240 L80,190 Z"/>
          <!-- 青海省 -->
          <path class="province" id="qinghai" data-name="青海" data-count="0" d="M190,170 L240,140 L280,180 L300,220 L270,260 L220,280 L200,240 L210,200 Z"/>
          <!-- 甘肃省 -->
          <path class="province" id="gansu" data-name="甘肃" data-count="0" d="M220,140 L280,110 L330,130 L290,150 L280,200 L330,210 L360,190 L380,220 L340,240 L310,230 L290,260 L250,270 Z"/>
          <!-- 宁夏回族自治区 -->
          <path class="province" id="ningxia" data-name="宁夏" data-count="0" d="M350,220 L370,210 L380,240 L360,250 L340,240 Z"/>

          <path class="province" id="shaanxi" data-name="陕西" data-count="0" d="M370,220 L400,210 L430,220 L420,260 L400,280 L370,270 L360,240 Z"/>

          <!-- 河北省 -->

          <!-- 北京市 -->
          <path class="province" id="beijing" data-name="北京" data-count="0" d="M510,240 L530,230 L540,250 L530,260 L510,250 Z"/>
          <!-- 天津市 -->
          <path class="province" id="tianjin" data-name="天津" data-count="0" d="M520,260 L540,250 L550,270 L530,280 Z"/>
          <!-- 山东省 -->
          <path class="province" id="shandong" data-name="山东" data-count="0" d="M480,280 L520,270 L560,280 L550,320 L520,330 L490,310 Z"/>
          <!-- 河南省 -->
          <path class="province" id="henan" data-name="河南" data-count="0" d="M410,280 L450,270 L490,290 L480,330 L450,350 L420,340 Z"/>
          <!-- 江苏省 -->
          <path class="province" id="jiangsu" data-name="江苏" data-count="0" d="M500,330 L530,320 L570,340 L560,380 L530,390 L500,370 Z"/>
          <!-- 上海市 -->
          <path class="province" id="shanghai" data-name="上海" data-count="0" d="M540,390 L560,380 L570,400 L550,410 Z"/>
          <!-- 浙江省 -->

          <!-- 台湾省 -->
          <path class="province" id="taiwan" data-name="台湾" data-count="0" d="M560,470 L590,460 L600,500 L570,520 Z"/>

          <!-- 香港特别行政区 -->
          <path class="province" id="hongkong" data-name="香港" data-count="0" d="M480,550 L490,540 L495,555 L480,560 Z"/>
          <!-- 澳门特别行政区 -->
          <path class="province" id="macau" data-name="澳门" data-count="0" d="M460,560 L470,555 L475,565 L460,570 Z"/>
          <!-- 海南省 -->
          <path class="province" id="hainan" data-name="海南" data-count="0" d="M410,570 L440,560 L450,600 L420,610 Z"/>
          <!-- 广西壮族自治区 -->
          <path class="province" id="guangxi" data-name="广西" data-count="0" d="M340,490 L390,510 L380,580 L340,600 L310,570 L320,520 Z"/>

          <!-- 安徽省 -->
          <path class="province" id="anhui" data-name="安徽" data-count="0" d="M460,360 L490,320 L510,380 L490,430 L450,420 Z"/>
          <!-- 四川省 -->
          <path class="province" id="sichuan" data-name="四川" data-count="0" d="M220,290 L280,270 L330,290 L350,340 L380,350 L400,300 L430,350 L390,400 L350,440 L300,430 L260,450 L220,470 L180,330 Z"/>
          <!-- 重庆市 -->
          <path class="province" id="chongqing" data-name="重庆" data-count="0" d="M300,430 L330,400 L350,440 L330,470 L280,450 Z"/>
        </svg>

        <div class="legend">
          <div class="legend-item">
            <div class="legend-color" style="background: #1a5f4a;"></div>
            <span>较少</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #4a9a6a;"></div>
            <span>一般</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #7cb880;"></div>
            <span>较多</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #b5d4a0;"></div>
            <span>密集</span>
          </div>
        </div>
      </div>

      <div class="stats-panel">
        <h3 class="stats-title">📊 游客统计</h3>
        <div class="stats-total">
          <div class="stats-number" id="totalVisitors">0</div>
          <div class="stats-label">总访客数</div>
        </div>
        <ul class="ranking-list" id="rankingList">
          <li class="ranking-item">
            <span class="ranking-rank">1</span>
            <span class="ranking-province">加载中...</span>
            <span class="ranking-count">0</span>
          </li>
        </ul>
      </div>

      <p style="color: var(--secondary-yellow); margin-top: 16px; font-size: 0.85rem; text-align: center;">
        点击地图省份查看详情 · 数据基于用户注册信息统计
      </p>
    </div>

    <a href="index.html" class="back-link" style="margin-top: 24px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回首页
    </a>
  </div>

  <div class="overlay hidden" id="overlay"></div>

  <div class="province-info hidden" id="provinceInfo">
    <h3 class="province-name" id="infoProvinceName">省份</h3>
    <div class="province-count" id="infoProvinceCount">0</div>
    <p class="province-label">游客数量</p>
    <button class="close-info" onclick="closeProvinceInfo()">关闭</button>
  </div>

  <script src="js/heatmap.js"></script>
</body>
</html>
