<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国游客热力图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #2d241c; 
      min-height: 100vh; 
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #d4af37; text-align: center; margin-bottom: 16px; }
    .china-map { 
      background: #1e3d5c; 
      border-radius: 12px; 
      overflow: hidden;
      margin-bottom: 20px;
    }
    .china-map svg { width: 100%; height: auto; }
    .legend { 
      display: flex; 
      justify-content: center; 
      gap: 24px; 
      margin-bottom: 20px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; color: #d4af37; font-size: 14px; }
    .legend-color { border-radius: 50%; }
    .stats-panel { 
      background: #3d3228; 
      border-radius: 12px; 
      padding: 20px; 
      color: #d4af37;
    }
    .stats-title { margin-bottom: 16px; }
    .stats-total { text-align: center; margin-bottom: 16px; }
    .stats-number { font-size: 36px; font-weight: bold; }
    .stats-label { font-size: 14px; opacity: 0.8; }
    .ranking-list { list-style: none; }
    .ranking-item { 
      display: flex; 
      justify-content: space-between; 
      padding: 8px 0; 
      border-bottom: 1px solid #4a4035;
    }
    .back-link { 
      display: block; 
      text-align: center; 
      color: #d4af37; 
      margin-top: 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>全国游客热力图</h1>
    
    <div class="china-map">
      <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="heat1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff4500;stop-opacity:0.8"/>
            <stop offset="40%" style="stop-color:#ff8c00;stop-opacity:0.4"/>
            <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="heat2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff6347;stop-opacity:0.6"/>
            <stop offset="50%" style="stop-color:#ffa500;stop-opacity:0.3"/>
            <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="heat3" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff7f50;stop-opacity:0.4"/>
            <stop offset="60%" style="stop-color:#ffb347;stop-opacity:0.2"/>
            <stop offset="100%" style="stop-color:#ffff99;stop-opacity:0"/>
          </radialGradient>
        </defs>
        
        <!-- 中国地图轮廓 -->
        <path d="M180,80 L220,75 L260,90 L300,80 L330,105 L360,95 L390,125 L410,115 L430,145 L415,165 L385,155 L365,185 L335,175 L315,205 L285,195 L265,225 L235,215 L215,245 L205,235 L215,210 L255,175 L290,155 L310,140 L330,120 L350,105 L370,90 L390,75 L410,60 L430,45 L410,35 L370,45 L330,55 L310,70 L300,60 L280,45 L240,55 L200,75 L180,90 L160,110 L140,140 L120,180 L100,230 L105,260 L125,310 L145,360 L165,410 L185,460 L205,510 L225,560 L245,610 L265,660 L285,710 L305,760 L325,810 L345,860 L365,910 L380,940 L400,945 L450,935 L500,925 L550,915 L600,905 L650,895 L700,885 L750,875 L800,865 L830,860 L825,840 L805,790 L785,740 L765,690 L745,640 L725,590 L705,540 L685,490 L665,440 L645,390 L625,340 L605,290 L585,240 L565,200 L545,210 L525,190 L495,200 L465,170 L425,180 L405,160 L385,165 L365,145 L325,150 L305,135 L265,145 L235,165 L215,185 L205,200 L195,190 L205,165 L245,130 L280,110 L300,95 L320,75 L300,65 L260,75 L220,95 L200,110 L180,130 L170,120 L180,95 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 台湾岛 -->
        <path d="M680,220 L710,210 L730,240 L720,270 L690,290 L670,270 L660,240 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 海南岛 -->
        <path d="M460,400 L490,390 L500,420 L490,450 L460,470 L440,450 L430,420 Z" fill="#f5f0e6" stroke="#c9b896" stroke-width="1"/>
        
        <!-- 热力热点 -->
        <circle cx="520" cy="160" r="80" fill="url(#heat1)"/>
        <circle cx="570" cy="250" r="90" fill="url(#heat1)"/>
        <circle cx="550" cy="360" r="85" fill="url(#heat1)"/>
        
        <circle cx="400" cy="330" r="70" fill="url(#heat2)"/>
        <circle cx="480" cy="290" r="65" fill="url(#heat2)"/>
        <circle cx="370" cy="210" r="60" fill="url(#heat2)"/>
        
        <circle cx="650" cy="130" r="55" fill="url(#heat3)"/>
        <circle cx="460" cy="250" r="50" fill="url(#heat3)"/>
        <circle cx="490" cy="320" r="50" fill="url(#heat3)"/>
        <circle cx="590" cy="240" r="50" fill="url(#heat3)"/>
        <circle cx="390" cy="390" r="45" fill="url(#heat3)"/>
        <circle cx="300" cy="240" r="40" fill="url(#heat3)"/>
        <circle cx="150" cy="150" r="45" fill="url(#heat3)"/>
        <circle cx="630" cy="80" r="40" fill="url(#heat3)"/>
        <circle cx="630" cy="320" r="35" fill="url(#heat3)"/>
        
        <!-- 城市标注 -->
        <text x="520" y="155" font-size="10" fill="#6b5344" text-anchor="middle">北京</text>
        <text x="575" y="245" font-size="10" fill="#6b5344" text-anchor="middle">上海</text>
        <text x="545" y="355" font-size="10" fill="#6b5344" text-anchor="middle">广州</text>
        <text x="395" y="325" font-size="10" fill="#6b5344" text-anchor="middle">成都</text>
        <text x="365" y="205" font-size="10" fill="#6b5344" text-anchor="middle">西安</text>
      </svg>
    </div>
    
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="width: 40px; height: 40px; background: radial-gradient(circle, #ff4500 0%, #ff8c00 50%, transparent 100%);"></div>
        <span>密集</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 35px; height: 35px; background: radial-gradient(circle, #ff6347 0%, #ffa500 50%, transparent 100%);"></div>
        <span>较多</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 30px; height: 30px; background: radial-gradient(circle, #ff7f50 0%, #ffb347 50%, transparent 100%);"></div>
        <span>一般</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="width: 25px; height: 25px; background: radial-gradient(circle, #ffaa00 0%, #ffd700 50%, transparent 100%);"></div>
        <span>较少</span>
      </div>
    </div>
    
    <div class="stats-panel">
      <h3 class="stats-title">📊 游客统计</h3>
      <div class="stats-total">
        <div class="stats-number">2,951</div>
        <div class="stats-label">总访客数</div>
      </div>
      <ul class="ranking-list">
        <li class="ranking-item"><span>1</span><span>北京</span><span>523</span></li>
        <li class="ranking-item"><span>2</span><span>上海</span><span>486</span></li>
        <li class="ranking-item"><span>3</span><span>广州</span><span>412</span></li>
        <li class="ranking-item"><span>4</span><span>成都</span><span>356</span></li>
        <li class="ranking-item"><span>5</span><span>深圳</span><span>298</span></li>
      </ul>
    </div>
    
    <a href="index.html" class="back-link">← 返回首页</a>
  </div>
</body>
</html>
