<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文物修复 - 归位国宝</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">益州郡府</span>
        </div>
        <div class="user-area">
          <button class="user-btn" id="userBtn" onclick="checkLogin()">未登录</button>
        </div>
      </div>
    </header>

    <div class="game-container">
      <div class="game-header">
        <h1 class="game-title-header">🧩 文物修复</h1>
        <p class="game-description" style="font-size: 0.9rem; color: var(--secondary-yellow); opacity: 0.8; margin-top: 8px;">
          出土文物残破不堪，急需修复师归位！请运用你的巧手，重现国宝风采。
        </p>
        <div class="game-score" id="gameScore">用时: 0:00 | 步数: 0</div>
      </div>

      <div class="current-image-display" style="text-align: center; margin-bottom: 16px;">
        <span style="color: var(--accent-gold); font-size: 1.1rem; font-weight: bold;">当前文物：<span id="currentImageLabel">滇王之印</span></span>
      </div>

      <div class="difficulty-selector">
        <button class="difficulty-btn active" data-size="3" onclick="setDifficulty(3)">简单(3×3)</button>
        <button class="difficulty-btn" data-size="4" onclick="setDifficulty(4)">困难 (4×4)</button>
      </div>

      <div class="puzzle-area">
        <div class="puzzle-grid size-3" id="puzzleGrid"></div>
        <div class="puzzle-stats">
          <span id="timerDisplay">00:00</span>
          <span id="moveDisplay">步数: 0</span>
        </div>
      </div>

      <div class="action-bar">
        <button class="action-btn" onclick="changeImage()">更换图片</button>
        <button class="action-btn primary" onclick="resetPuzzle()">重新开始</button>
      </div>
    </div>

    <a href="index.html" class="back-link" style="margin-top: 24px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回首页
    </a>
  </div>

  <div class="completion-overlay hidden" id="winModal">
    <div class="completion-card">
      <div class="completion-badge">🧩</div>
      <div class="completion-title">国宝重现</div>
      <div class="completion-subtitle">残片归位，古韵重生，尘封的国宝终于重现昔日风采……</div>
      <div class="completion-divider"></div>
      <div class="completion-score-row">
        <div class="completion-score-item">
          <span class="completion-score-value" id="winTime">0:00</span>
          <div class="completion-score-label">用时</div>
        </div>
        <div class="completion-score-item">
          <span class="completion-score-value" id="winMoves">0</span>
          <div class="completion-score-label">步数</div>
        </div>
      </div>
      <div class="completion-medal">
        <div class="completion-medal-icon">🏆</div>
        <div class="completion-medal-title">巧手修复师</div>
        <div class="completion-medal-desc">文物修复考核通过</div>
      </div>
      <div class="completion-buttons">
        <button class="completion-btn primary" onclick="goCertificate()">📜 查看任职文书</button>
        <button class="completion-btn secondary" onclick="closeWinModal()">继续挑战</button>
        <a href="index.html" class="completion-btn secondary">🏛️ 返回郡府</a>
      </div>
    </div>
  </div>

  <script src="js/career.js"></script>
  <script src="js/app.js"></script>
  <script src="js/puzzle.js"></script>
  <script>
    function goCertificate() {
      window.location.href = 'certificate.html';
    }
  </script>
</body>
</html>
