<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>河伯所·古滇探秘 - 线上模拟考古</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    .excavation-hole {
      position: absolute;
      width: 60px;
      height: 60px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(60, 40, 20, 0.9) 0%, rgba(40, 25, 10, 0.8) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: holeAppear 0.3s ease-out forwards;
      box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.5), 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .excavation-hole::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border: 3px dashed rgba(139, 105, 20, 0.5);
      border-radius: 50%;
      animation: holeRotate 3s linear infinite;
    }

    .excavation-hole::after {
      content: '⛏️';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      opacity: 0.6;
    }

    .excavation-hole.cleaned {
      animation: holeClose 0.5s ease-out forwards;
    }

    @keyframes holeAppear {
      from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes holeRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes holeClose {
      from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      to { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    }

    #toolTip {
      position: fixed;
      background: rgba(40, 30, 15, 0.95);
      color: #FFD700;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 1000;
      max-width: 280px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(139, 105, 20, 0.6);
      display: none;
    }

    #toolTip.show {
      display: block;
      animation: tooltipFadeIn 0.2s ease-out;
    }

    @keyframes tooltipFadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .artifact-gallery {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 22, 12, 0.98);
      border: 2px solid #8B6914;
      border-radius: 16px;
      padding: 20px;
      z-index: 1001;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .artifact-gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(139, 105, 20, 0.4);
    }

    .artifact-gallery-header h2 {
      color: #FFD700;
      font-size: 1.2rem;
      margin: 0;
    }

    .artifact-gallery-close {
      background: none;
      border: none;
      color: #C9A227;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .artifact-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 12px;
    }

    .artifact-gallery-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      background: rgba(61, 50, 40, 0.6);
      border-radius: 10px;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .artifact-gallery-item.discovered {
      border-color: #8B6914;
      background: rgba(139, 105, 20, 0.2);
    }

    .artifact-gallery-item.undiscovered {
      opacity: 0.5;
    }

    .artifact-gallery-item.undiscovered .artifact-gallery-icon {
      filter: grayscale(100%);
    }

    .artifact-gallery-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .artifact-gallery-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .artifact-gallery-name {
      font-size: 0.8rem;
      color: #C9A227;
      text-align: center;
    }

    .artifact-gallery-item.undiscovered .artifact-gallery-name {
      color: #666;
    }

    .reveal-modal-content {
      text-align: center;
    }

    .reveal-modal-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .reveal-modal-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 480px) {
      .artifact-gallery {
        width: 95%;
        padding: 16px;
      }

      .artifact-gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
        gap: 8px;
      }

      .artifact-gallery-icon {
        width: 40px;
        height: 40px;
      }

      .artifact-gallery-name {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="container archaeology-page" id="app">
    <header class="header">
      <div class="header-content">
        <div class="logo" onclick="window.location.href='index.html'">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">河伯所</span>
        </div>
        <div class="user-area">
          <div id="userInfo" class="user-info">
            <button class="user-btn" id="userBtn" onclick="handleUserAction()">登录</button>
          </div>
        </div>
      </div>
    </header>

    <div class="game-container">
      <div class="game-header">
        <h1 class="game-title">线上模拟考古</h1>
        <div class="progress-info">
          <span id="foundCount">0</span> / <span id="totalSpots">3</span> 件文物
        </div>
      </div>

      <div class="game-tips">
        <div class="tip-item">
          <span class="tip-number">1</span>
          <span>选择<span class="highlight">探测器</span>，点击土地扫描</span>
        </div>
        <div class="tip-item">
          <span class="tip-number">2</span>
          <span>发现文物后，选择<span class="highlight">铁锹</span>或<span class="highlight">锄头</span>挖掘</span>
        </div>
        <div class="tip-item">
          <span class="tip-number">3</span>
          <span>挖掘完毕，选择<span class="highlight">刷子</span>清理文物</span>
        </div>
      </div>

      <div class="tool-bar">
        <button class="tool-item active" data-tool="detector" onclick="selectTool('detector')">
          <span class="tool-icon">🔍</span>
          <span class="tool-name">探测器</span>
        </button>
        <button class="tool-item" data-tool="shovel" onclick="selectTool('shovel')">
          <span class="tool-icon">⛏️</span>
          <span class="tool-name">铁锹</span>
        </button>
        <button class="tool-item" data-tool="pickaxe" onclick="selectTool('pickaxe')">
          <span class="tool-icon">🔨</span>
          <span class="tool-name">锄头</span>
        </button>
        <button class="tool-item" data-tool="brush" onclick="selectTool('brush')">
          <span class="tool-icon">🖌️</span>
          <span class="tool-name">刷子</span>
        </button>
      </div>

      <div class="dig-area">
        <div id="digGround" class="dig-ground">
          <div id="artifactMarkers" class="artifact-markers"></div>
          <div id="scanEffect" class="scan-effect"></div>
        </div>
      </div>

      <div class="status-bar">
        <span class="status-icon">🔍</span>
        <span class="status-text">选择探测器扫描土地</span>
      </div>

      <div class="action-bar">
        <button class="action-btn" onclick="resetGame()">重新开始</button>
        <button class="action-btn" onclick="viewArtifactGallery()">图鉴</button>
        <button class="action-btn primary" onclick="viewCollection()">
          收藏 (<span id="collectionCount">0</span>)
        </button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden" onclick="closeAllModals()"></div>

    <div id="artifactGallery" class="artifact-gallery hidden">
      <div class="artifact-gallery-header">
        <h2>📜 文物图鉴</h2>
        <button class="artifact-gallery-close" onclick="closeArtifactGallery()">×</button>
      </div>
      <div id="artifactGalleryGrid" class="artifact-gallery-grid"></div>
    </div>

    <div id="artifactReveal" class="reveal-modal hidden">
      <div class="reveal-content">
        <div class="reveal-modal-content">
          <div class="reveal-modal-icon" id="revealIcon"></div>
          <h2 id="revealName" class="reveal-name">文物名称</h2>
          <p id="revealEra" class="reveal-era">时代</p>
        </div>
        <button class="close-btn" onclick="closeReveal()" style="margin-top: 16px;">确定</button>
      </div>
    </div>

    <div id="collectionView" class="collection-modal hidden">
      <div class="collection-header">
        <h2>我的收藏</h2>
        <button class="close-btn" onclick="closeOverlay()">×</button>
      </div>
      <div id="collectionGrid" class="collection-grid"></div>
    </div>

    <div id="toolTip" class="tooltip"></div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/archaeology.js"></script>
</body>
</html>
