<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实地勘探 - 寻找前朝官印</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #2c1810 0%, #1a0f0a 100%);
      min-height: 100vh;
      color: #D4C4A8;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #C9A227;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
    }

    .logo-text {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-btn {
      background: #8B6914;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .user-btn:hover {
      background: #A68027;
    }

    .game-container {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      padding: 20px;
    }

    .game-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .game-title {
      color: #FFD700;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .progress-info {
      color: #C9A227;
      font-size: 0.9rem;
    }

    .game-tips {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding: 12px;
      background: rgba(139, 105, 20, 0.1);
      border-radius: 10px;
    }

    .tip-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .tip-number {
      width: 24px;
      height: 24px;
      background: #8B6914;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: white;
    }

    .highlight {
      color: #FFD700;
      font-weight: bold;
    }

    .tool-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tool-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 20px;
      background: rgba(61, 50, 40, 0.8);
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 80px;
    }

    .tool-item:hover {
      border-color: #8B6914;
      background: rgba(139, 105, 20, 0.2);
    }

    .tool-item.active {
      border-color: #FFD700;
      background: rgba(255, 215, 0, 0.1);
    }

    .tool-icon {
      font-size: 1.5rem;
    }

    .tool-name {
      font-size: 0.8rem;
      color: #C9A227;
    }

    .dig-area {
      margin-bottom: 20px;
    }

    .dig-ground {
      position: relative;
      width: 100%;
      height: 300px;
      background: linear-gradient(180deg, #8B7355 0%, #6B5344 100%);
      border-radius: 12px;
      overflow: hidden;
      cursor: crosshair;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .artifact-markers {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .artifact-marker {
      position: absolute;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .artifact-marker.hidden {
      display: none;
    }

    .artifact-marker.detected {
      animation: pulse 1.5s infinite;
    }

    .artifact-marker.detected::before {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border: 3px solid #FFD700;
      border-radius: 50%;
      animation: ring 1.5s infinite;
    }

    .artifact-marker.detected::after {
      content: '藏';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FFD700;
      font-size: 16px;
    }

    .artifact-marker.excavating::before {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid #FF6B35;
      border-radius: 50%;
      animation: excavate 0.5s infinite;
    }

    .artifact-marker.excavated::before {
      content: '';
      position: absolute;
      width: 25px;
      height: 25px;
      border: 3px solid #4CAF50;
      border-radius: 50%;
    }

    .artifact-marker.excavated::after {
      content: '获';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #4CAF50;
      font-size: 14px;
    }

    .excavation-hole {
      position: absolute;
      width: 60px;
      height: 60px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, #2c1810 0%, #1a0f0a 70%, transparent 100%);
      border-radius: 50%;
      animation: holeGrow 0.5s ease-out;
    }

    .excavation-hole.cleaned {
      animation: holeFade 0.5s ease-out forwards;
    }

    .scan-effect {
      position: absolute;
      width: 100px;
      height: 100px;
      border: 3px solid rgba(255, 215, 0, 0.6);
      border-radius: 50%;
      pointer-events: none;
      animation: scanPulse 0.5s ease-out forwards;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }

    @keyframes ring {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    @keyframes excavate {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }

    @keyframes holeGrow {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes holeFade {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    }

    @keyframes scanPulse {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: rgba(61, 50, 40, 0.6);
      border-radius: 25px;
      margin-bottom: 16px;
    }

    .status-icon {
      font-size: 1.1rem;
    }

    .status-text {
      color: #C9A227;
      font-size: 0.9rem;
    }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 10px 20px;
      background: rgba(139, 105, 20, 0.3);
      border: 1px solid #8B6914;
      color: #C9A227;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      background: rgba(139, 105, 20, 0.5);
    }

    .action-btn.primary {
      background: #8B6914;
      color: white;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay.hidden {
      display: none;
    }

    .artifact-gallery {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 22, 12, 0.98);
      border: 2px solid #8B6914;
      border-radius: 16px;
      padding: 24px;
      z-index: 1001;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .artifact-gallery.hidden {
      display: none;
    }

    .artifact-gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(139, 105, 20, 0.4);
    }

    .artifact-gallery-header h2 {
      color: #FFD700;
      font-size: 1.3rem;
      margin: 0;
    }

    .artifact-gallery-close {
      background: none;
      border: none;
      color: #C9A227;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .artifact-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
    }

    .artifact-gallery-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 8px;
      background: rgba(61, 50, 40, 0.6);
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .artifact-gallery-item:hover {
      background: rgba(139, 105, 20, 0.2);
    }

    .artifact-gallery-item.undiscovered {
      filter: grayscale(100%);
      opacity: 0.5;
    }

    .artifact-gallery-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .artifact-gallery-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .artifact-gallery-name {
      font-size: 0.8rem;
      color: #C9A227;
      text-align: center;
    }

    .artifact-gallery-item.undiscovered .artifact-gallery-name {
      color: #666;
    }

    .reveal-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 22, 12, 0.98);
      border: 2px solid #8B6914;
      border-radius: 16px;
      z-index: 1001;
      width: 90%;
      max-width: 320px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .reveal-modal.hidden {
      display: none;
    }

    .reveal-modal .reveal-content {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .reveal-image-container {
      width: 100%;
      height: 180px;
      background: #1a0f0a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .reveal-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .reveal-info {
      padding: 20px;
      text-align: center;
    }

    .reveal-modal .reveal-name {
      color: #FFD700;
      font-size: 1.3rem;
      margin: 0 0 8px 0;
    }

    .reveal-modal .reveal-era {
      color: #C9A227;
      font-size: 0.9rem;
      margin: 0 0 16px 0;
    }

    .close-btn {
      background: #8B6914;
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
    }

    .close-btn:hover {
      background: #A68027;
    }

    .collection-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 22, 12, 0.98);
      border: 2px solid #8B6914;
      border-radius: 16px;
      padding: 20px;
      z-index: 1001;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .collection-modal.hidden {
      display: none;
    }

    .collection-modal .collection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(139, 105, 20, 0.4);
    }

    .collection-modal .collection-header h2 {
      color: #FFD700;
      font-size: 1.2rem;
      margin: 0;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }

    .collection-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      background: rgba(61, 50, 40, 0.6);
      border-radius: 10px;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .collection-card:hover {
      border-color: #8B6914;
      background: rgba(139, 105, 20, 0.2);
      transform: scale(1.05);
    }

    .collection-card .artifact-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .collection-card .artifact-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .collection-card .artifact-name {
      color: #C9A227;
      font-size: 0.8rem;
      margin: 0 0 4px 0;
      text-align: center;
    }

    .collection-card .artifact-era {
      color: #8B7355;
      font-size: 0.7rem;
      margin: 0;
    }

    .image-zoom-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 22, 12, 0.98);
      border: 2px solid #8B6914;
      border-radius: 16px;
      z-index: 1002;
      width: 90%;
      max-width: 500px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .image-zoom-modal.hidden {
      display: none;
    }

    .image-zoom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(139, 105, 20, 0.4);
    }

    .image-zoom-header h3 {
      color: #FFD700;
      font-size: 1.1rem;
      margin: 0;
    }

    .image-zoom-close {
      background: none;
      border: none;
      color: #C9A227;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .image-zoom-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .image-zoom-content img {
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 8px;
    }

    .image-zoom-content p {
      color: #C9A227;
      margin-top: 12px;
      font-size: 0.9rem;
      text-align: center;
    }

    .tooltip {
      position: fixed;
      background: rgba(0, 0, 0, 0.9);
      color: #FFD700;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .tooltip.show {
      opacity: 1;
    }

    @media (max-width: 480px) {
      .game-container {
        padding: 12px;
      }

      .game-title {
        font-size: 1.2rem;
      }

      .game-tips {
        gap: 8px;
      }

      .tip-item {
        font-size: 0.75rem;
      }

      .tool-bar {
        gap: 8px;
      }

      .tool-item {
        min-width: 70px;
        padding: 10px 12px;
      }

      .tool-icon {
        font-size: 1.2rem;
      }

      .tool-name {
        font-size: 0.7rem;
      }

      .dig-ground {
        height: 250px;
      }

      .artifact-gallery {
        width: 95%;
        padding: 16px;
      }

      .artifact-gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
        gap: 8px;
      }

      .artifact-gallery-icon {
        width: 40px;
        height: 40px;
      }

      .artifact-gallery-name {
        font-size: 0.7rem;
      }

      .reveal-modal {
        width: 95%;
        max-width: 280px;
      }

      .reveal-image-container {
        height: 150px;
      }

      .reveal-modal .reveal-name {
        font-size: 1.1rem;
      }

      .collection-modal {
        width: 95%;
        padding: 16px;
      }

      .collection-grid {
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 8px;
      }

      .collection-card {
        padding: 10px 6px;
      }

      .collection-card .artifact-icon {
        width: 40px;
        height: 40px;
      }

      .collection-card .artifact-name {
        font-size: 0.7rem;
      }

      .collection-card .artifact-era {
        font-size: 0.6rem;
      }

      .image-zoom-modal {
        width: 95%;
      }

      .image-zoom-content img {
        max-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container archaeology-page" id="app">
    <header class="header">
      <div class="header-content">
        <div class="logo" onclick="window.location.href='index.html'">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">益州郡府</span>
        </div>
        <div class="user-area">
          <div id="userInfo" class="user-info">
            <button class="user-btn" id="userBtn" onclick="handleUserAction()">登录</button>
          </div>
        </div>
      </div>
    </header>

    <div class="game-container">
      <div class="game-header">
        <h1 class="game-title">⛏️ 实地勘探</h1>
        <p style="color: #C9A227; font-size: 0.9rem; margin-top: 4px;">恭喜通过笔试！现在请前往古城遗址进行实地考察，寻找前朝遗留的官印。</p>
        <div class="progress-info" style="margin-top:8px">
          <span id="foundCount">0</span> / <span id="totalSpots">3</span> 件文物</div>
      </div>

      <div class="game-tips">
        <div class="tip-item">
          <span class="tip-number">1</span>
          <span>选择<span class="highlight">探测器</span>，扫描地层寻找异常</span>
        </div>
        <div class="tip-item">
          <span class="tip-number">2</span>
          <span>发现异常后，用<span class="highlight">铁锹</span>或<span class="highlight">锄头</span>挖掘</span>
        </div>
        <div class="tip-item">
          <span class="tip-number">3</span>
          <span>挖掘完毕，用<span class="highlight">刷子</span>清理出土文物</span>
        </div>
      </div>

      <div class="tool-bar">
        <button class="tool-item active" data-tool="detector" onclick="selectTool('detector')">
          <span class="tool-icon">🔍</span>
          <span class="tool-name">探测器</span>
        </button>
        <button class="tool-item" data-tool="shovel" onclick="selectTool('shovel')">
          <span class="tool-icon">⛏️</span>
          <span class="tool-name">铁锹</span>
        </button>
        <button class="tool-item" data-tool="pickaxe" onclick="selectTool('pickaxe')">
          <span class="tool-icon">🔨</span>
          <span class="tool-name">锄头</span>
        </button>
        <button class="tool-item" data-tool="brush" onclick="selectTool('brush')">
          <span class="tool-icon">🖌️</span>
          <span class="tool-name">刷子</span>
        </button>
      </div>

      <div class="dig-area">
        <div id="digGround" class="dig-ground">
          <div id="artifactMarkers" class="artifact-markers"></div>
          <div id="scanEffect" class="scan-effect"></div>
        </div>
      </div>

      <div class="status-bar">
        <span class="status-icon">🔍</span>
        <span class="status-text">选择探测器扫描土地</span>
      </div>

      <div class="action-bar">
        <button class="action-btn" onclick="goHome()">🏠 返回首页</button>
        <button class="action-btn" onclick="resetGame()">重新开始</button>
        <button class="action-btn" onclick="viewArtifactGallery()">图鉴</button>
        <button class="action-btn primary" onclick="viewCollection()">
          收藏 (<span id="collectionCount">0</span>)
        </button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden" onclick="closeAllModals()"></div>

    <div id="artifactGallery" class="artifact-gallery hidden">
      <div class="artifact-gallery-header">
        <h2>📜 文物图鉴</h2>
        <button class="artifact-gallery-close" onclick="closeArtifactGallery()">×</button>
      </div>
      <div id="artifactGalleryGrid" class="artifact-gallery-grid"></div>
    </div>

    <div id="artifactReveal" class="reveal-modal hidden">
      <div class="reveal-content">
        <div class="reveal-image-container">
          <img id="revealImage" class="reveal-image" src="" alt="文物图片">
        </div>
        <div class="reveal-info">
          <h2 id="revealName" class="reveal-name">文物名称</h2>
          <p id="revealEra" class="reveal-era">时代</p>
          <button class="close-btn" onclick="closeReveal()">确定</button>
        </div>
      </div>
    </div>

    <div id="collectionView" class="collection-modal hidden">
      <div class="collection-header">
        <h2>🎒 我的收藏</h2>
        <button class="close-btn" onclick="closeOverlay()">×</button>
      </div>
      <div id="collectionGrid" class="collection-grid"></div>
    </div>

    <div id="imageZoomModal" class="image-zoom-modal hidden">
      <div class="image-zoom-header">
        <h3 id="zoomTitle">文物详情</h3>
        <button class="image-zoom-close" onclick="closeImageZoom()">×</button>
      </div>
      <div class="image-zoom-content">
        <img id="zoomImage" src="" alt="放大的文物图片"
        <p id="zoomName"></p>
      </div>
    </div>

    <div id="toolTip" class="tooltip"></div>
  </div>
