<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>线上模拟考古 - 河伯所·古滇探秘</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">河伯所</span>
        </div>
        <div class="user-area">
          <button class="user-btn" id="userBtn" onclick="checkLogin()">未登录</button>
        </div>
      </div>
    </header>

    <div class="game-container">
      <div class="game-header">
        <h1 class="game-title-header">线上模拟考古</h1>
        <div class="game-score">
          <span id="foundCount">0</span> / <span id="totalSpots">5</span> 件文物
        </div>
      </div>

      <p style="color: var(--secondary-yellow); margin-bottom: 16px; font-size: 0.9rem;">
        点击挖掘点，探索隐藏在土地下的古滇文物
      </p>

      <div class="dig-area">
        <div class="dig-grid" id="digGrid"></div>
      </div>

      <div class="action-bar">
        <button class="action-btn" onclick="resetGame()">重新开始</button>
        <button class="action-btn primary" onclick="viewCollection()">我的收藏 (<span id="collectionCount">0</span>)</button>
      </div>

      <h2 class="section-title" style="margin-top: 24px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8L12 2Z"/>
        </svg>
        文物图鉴
      </h2>

      <div class="collection-grid" id="collectionGrid"></div>
    </div>

    <a href="index.html" class="back-link" style="margin-top: 24px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回首页
    </a>
  </div>

  <div class="overlay hidden" id="overlay"></div>

  <div class="artifact-reveal hidden" id="artifactReveal">
    <svg class="artifact-image" id="revealIcon" viewBox="0 0 100 100"></svg>
    <h3 class="artifact-name" id="revealName"></h3>
    <p class="artifact-era" id="revealEra"></p>
    <p class="artifact-desc" id="revealDesc"></p>
    <button class="submit-btn" style="margin-top: 16px;" onclick="closeReveal()">收入囊中</button>
  </div>

  <script src="js/archaeology.js"></script>
</body>
</html>
