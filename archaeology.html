<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>线上模拟考古 - 河伯所·古滇探秘</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">河伯所</span>
        </div>
        <div class="user-area">
          <button class="user-btn" id="userBtn" onclick="checkLogin()">未登录</button>
        </div>
      </div>
    </header>

    <div class="game-container">
      <div class="game-header">
        <h1 class="game-title-header">地里考古</h1>
        <div class="game-score">
          <span id="foundCount">0</span> / <span id="totalSpots">3</span> 件文物
        </div>
      </div>

      <p style="color: var(--secondary-yellow); margin-bottom: 16px; font-size: 0.9rem;">
        选择工具挖掘土地，寻找隐藏的古滇文物
      </p>

      <div class="tool-bar" id="toolBar">
        <div class="tool-item active" data-tool="shovel" onclick="selectTool('shovel')">
          <svg class="tool-icon" viewBox="0 0 48 48">
            <path d="M24 8 L28 12 L26 36 L22 36 L20 12 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <rect x="18" y="36" width="12" height="4" rx="1" fill="currentColor"/>
          </svg>
          <span>铁锹</span>
        </div>
        <div class="tool-item" data-tool="pickaxe" onclick="selectTool('pickaxe')">
          <svg class="tool-icon" viewBox="0 0 48 48">
            <path d="M16 36 L24 20 L32 36" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <path d="M12 12 L24 20 L36 12" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <line x1="24" y1="20" x2="24" y2="40" stroke="currentColor" stroke-width="2.5"/>
          </svg>
          <span>锄头</span>
        </div>
        <div class="tool-item" data-tool="brush" onclick="selectTool('brush')">
          <svg class="tool-icon" viewBox="0 0 48 48">
            <rect x="20" y="6" width="8" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M18 26 L18 38 Q24 42 30 38 L30 26" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="20" y1="32" x2="20" y2="36" stroke="currentColor" stroke-width="1"/>
            <line x1="24" y1="34" x2="24" y2="38" stroke="currentColor" stroke-width="1"/>
            <line x1="28" y1="32" x2="28" y2="36" stroke="currentColor" stroke-width="1"/>
          </svg>
          <span>刷子</span>
        </div>
        <div class="tool-item" data-tool="detector" onclick="selectTool('detector')">
          <svg class="tool-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="24" y1="26" x2="24" y2="40" stroke="currentColor" stroke-width="2.5"/>
            <line x1="18" y1="40" x2="30" y2="40" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="24" cy="16" r="4" fill="currentColor"/>
          </svg>
          <span>探测器</span>
        </div>
      </div>

      <div class="dig-area">
        <div class="dig-ground" id="digGround">
          <div class="ground-layer layer-3"></div>
          <div class="ground-layer layer-2"></div>
          <div class="ground-layer layer-1"></div>
          <div class="dig-spots" id="digSpots"></div>
        </div>
      </div>

      <div class="action-bar">
        <button class="action-btn" onclick="resetGame()">重新挖掘</button>
        <button class="action-btn primary" onclick="viewCollection()">我的收藏 (<span id="collectionCount">0</span>)</button>
      </div>

      <h2 class="section-title" style="margin-top: 24px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8L12 2Z"/>
        </svg>
        文物图鉴
      </h2>

      <div class="collection-grid" id="collectionGrid"></div>
    </div>

    <a href="index.html" class="back-link" style="margin-top: 24px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回首页
    </a>
  </div>

  <div class="overlay hidden" id="overlay"></div>

  <div class="artifact-reveal hidden" id="artifactReveal">
    <svg class="artifact-image" id="revealIcon" viewBox="0 0 100 100"></svg>
    <h3 class="artifact-name" id="revealName"></h3>
    <p class="artifact-era" id="revealEra"></p>
    <p class="artifact-desc" id="revealDesc"></p>
    <button class="submit-btn" style="margin-top: 16px;" onclick="closeReveal()">收入囊中</button>
  </div>

  <div class="tool-tip" id="toolTip"></div>

  <script src="js/archaeology.js"></script>
</body>
</html>
