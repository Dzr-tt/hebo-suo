<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>河伯所·古滇探秘 - 线上模拟考古</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
  <div class="container page" id="app">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">河伯所</span>
        </div>
        <div class="user-area">
          <button class="user-btn" id="userBtn" onclick="handleUserAction()">登录</button>
        </div>
      </div>
    </header>

    <section class="hero">
      <svg class="sun-pattern" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="25" fill="none" stroke="#FFD700" stroke-width="2"/>
        <circle cx="30" cy="30" r="15" fill="none" stroke="#FFD700" stroke-width="1.5"/>
        <circle cx="30" cy="30" r="5" fill="#FFD700"/>
        <g stroke="#FFD700" stroke-width="2">
          <line x1="30" y1="2" x2="30" y2="8"/>
          <line x1="30" y1="52" x2="30" y2="58"/>
          <line x1="2" y1="30" x2="8" y2="30"/>
          <line x1="52" y1="30" x2="58" y2="30"/>
          <line x1="10" y1="10" x2="14" y2="14"/>
          <line x1="46" y1="46" x2="50" y2="50"/>
          <line x1="50" y1="10" x2="46" y2="14"/>
          <line x1="14" y1="46" x2="10" y2="50"/>
        </g>
      </svg>
      <div class="hero-content">
        <h1 class="hero-title">古滇探秘</h1>
        <p class="hero-subtitle">探索河伯所文化 · 感受千年古滇文明</p>
      </div>
    </section>

    <h2 class="section-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8L12 2Z"/>
      </svg>
      游戏中心
    </h2>

    <div class="game-grid">
      <div class="game-card" onclick="navigateTo('archaeology.html')">
        <svg class="game-icon" viewBox="0 0 48 48">
          <path d="M24 4 C20 4 18 8 18 12 L18 16 L12 20 L12 24 L36 24 L36 20 L30 16 L30 12 C30 8 28 4 24 4 Z" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="24" width="20" height="16" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="14" y1="28" x2="34" y2="28" stroke="currentColor" stroke-width="2"/>
          <circle cx="20" cy="32" r="2" fill="currentColor"/>
          <circle cx="28" cy="32" r="2" fill="currentColor"/>
        </svg>
        <h3 class="game-title">线上模拟考古</h3>
        <p class="game-desc">挖掘沉睡的文物</p>
      </div>

      <div class="game-card" onclick="navigateTo('puzzle.html')">
        <svg class="game-icon" viewBox="0 0 48 48">
          <rect x="4" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="26" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="4" y="26" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="26" y="26" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="13" cy="13" r="4" fill="currentColor"/>
          <path d="M35 9 L39 13 L35 17" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="31" y="31" width="8" height="8" fill="currentColor"/>
        </svg>
        <h3 class="game-title">文物拼图</h3>
        <p class="game-desc">还原历史碎片</p>
      </div>

      <div class="game-card" onclick="navigateTo('quiz.html')">
        <svg class="game-icon" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
          <text x="24" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="currentColor">?</text>
          <circle cx="10" cy="10" r="3" fill="currentColor"/>
          <circle cx="38" cy="10" r="3" fill="currentColor"/>
          <circle cx="10" cy="38" r="3" fill="currentColor"/>
          <circle cx="38" cy="38" r="3" fill="currentColor"/>
        </svg>
        <h3 class="game-title">古滇知识问答</h3>
        <p class="game-desc">测试你的文化知识</p>
      </div>

      <div class="game-card heatmap-card full-width-card" onclick="navigateTo('heatmap.html')">
        <svg class="game-icon heatmap-icon" viewBox="0 0 48 48">
          <path d="M24 4 L24 12 M24 36 L24 44 M4 24 L12 24 M36 24 L44 24" stroke="currentColor" stroke-width="2"/>
          <ellipse cx="24" cy="24" rx="18" ry="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <ellipse cx="24" cy="24" rx="10" ry="18" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="24" cy="24" r="4" fill="currentColor"/>
          <path d="M16 16 Q24 20 32 16" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M16 32 Q24 28 32 32" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <h3 class="game-title">全国游客热力图</h3>
        <p class="game-desc">查看游客地域分布</p>
      </div>
    </div>

    <div class="cultural-pattern">
      <svg class="pattern-item" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
      </svg>
      <svg class="pattern-item" viewBox="0 0 24 24">
        <path d="M12 2 L14 8 L12 14 L10 8 Z" fill="currentColor"/>
        <path d="M12 22 L14 16 L12 10 L10 16 Z" fill="currentColor"/>
        <path d="M2 12 L8 10 L14 12 L8 14 Z" fill="currentColor"/>
        <path d="M22 12 L16 10 L10 12 L16 14 Z" fill="currentColor"/>
      </svg>
      <svg class="pattern-item" viewBox="0 0 24 24">
        <path d="M4 8 C8 4 16 4 20 8 L20 16 C16 20 8 20 4 16 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 10 L16 14 M16 10 L8 14" stroke="currentColor" stroke-width="1"/>
      </svg>
      <svg class="pattern-item" viewBox="0 0 24 24">
        <ellipse cx="12" cy="12" rx="8" ry="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <ellipse cx="12" cy="12" rx="4" ry="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
      </svg>
    </div>

    <footer class="footer">
      <p>© 2026 河伯所文化遗址 · 古滇探秘</p>
      <p style="margin-top: 8px; font-size: 0.8rem; opacity: 0.7;">探索古滇文明 · 传承历史文化</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
