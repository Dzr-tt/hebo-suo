<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>汉代职场晋升之路 - 益州郡新人报到</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    .career-intro {
      text-align: center;
      padding: 24px 16px;
      background: rgba(61, 50, 40, 0.6);
      border-radius: 16px;
      border: 2px solid var(--primary-bronze);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .career-intro::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,215,0,0.05) 0%, transparent 50%);
      pointer-events: none;
    }
    .career-badge {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .career-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.6rem;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .career-subtitle {
      color: var(--secondary-yellow);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .career-story {
      color: var(--text-primary);
      font-size: 0.9rem;
      line-height: 1.8;
      text-align: left;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .level-path {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .level-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: rgba(61, 50, 40, 0.5);
      border: 2px solid var(--primary-bronze);
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .level-card.locked {
      opacity: 0.5;
      border-color: rgba(139, 105, 20, 0.3);
    }
    .level-card.completed {
      border-color: var(--accent-gold);
      background: rgba(255, 215, 0, 0.05);
    }
    .level-num {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-bronze);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .level-card.completed .level-num {
      background: var(--accent-gold);
      color: #1a0f0a;
    }
    .level-info {
      flex: 1;
      text-align: left;
    }
    .level-name {
      font-size: 1.05rem;
      color: var(--accent-gold);
      font-weight: bold;
    }
    .level-desc {
      font-size: 0.85rem;
      color: var(--secondary-yellow);
      margin-top: 4px;
    }
    .level-status {
      font-size: 0.8rem;
      color: var(--accent-gold);
      text-align: right;
      min-width: 60px;
    }
    .arrow-down {
      text-align: center;
      color: var(--primary-bronze);
      font-size: 1.2rem;
      margin: -4px 0;
    }
    .start-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-family: 'Noto Serif SC', serif;
      background: linear-gradient(145deg, #8B6914 0%, #5c4a32 100%);
      border: 2px solid var(--accent-gold);
      border-radius: 30px;
      color: #FFD700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 16px;
    }
    .start-btn:hover {
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      transform: translateY(-2px);
    }
    .result-preview {
      background: rgba(61, 50, 40, 0.6);
      border: 2px solid var(--accent-gold);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      text-align: center;
    }
    .result-preview h3 {
      color: var(--accent-gold);
      margin-bottom: 12px;
    }
    .result-scores {
      display: flex;
      justify-content: space-around;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .result-scores span {
      color: var(--secondary-yellow);
    }
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      overflow-y: auto;
      padding: 20px;
    }
    .auth-overlay.hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- 登录注册覆盖层 -->
  <div id="authOverlay" class="auth-overlay hidden">
    <div class="bg-pattern"></div>
    <div class="auth-container" style="margin:auto;position:relative;z-index:10;">
      <div class="auth-card">
        <div class="card-logo">
          <svg viewBox="0 0 100 100" class="logo-main">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#8B6914" stroke-width="2"/>
            <circle cx="50" cy="50" r="35" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
            <path d="M50 18 L57 32 L50 46 L43 32 Z" fill="#FFD700"/>
            <circle cx="50" cy="58" r="20" fill="none" stroke="#8B6914" stroke-width="1.5"/>
            <circle cx="50" cy="58" r="6" fill="#8B6914"/>
            <circle cx="25" cy="25" r="3" fill="#C9A227" opacity="0.6"/>
            <circle cx="75" cy="25" r="3" fill="#C9A227" opacity="0.6"/>
            <circle cx="25" cy="75" r="3" fill="#C9A227" opacity="0.6"/>
            <circle cx="75" cy="75" r="3" fill="#C9A227" opacity="0.6"/>
          </svg>
          <h1 class="card-title">古滇探秘</h1>
          <p class="card-subtitle">探索河泊所文化遗址</p>
        </div>

        <div class="tabs-wrapper">
          <button class="tab active" id="tabLogin" onclick="showTab('login')">
            <span class="tab-text">登录</span>
            <span class="tab-indicator"></span>
          </button>
          <button class="tab" id="tabRegister" onclick="showTab('register')">
            <span class="tab-text">注册</span>
            <span class="tab-indicator"></span>
          </button>
        </div>

        <form id="formLogin" class="form-panel active" onsubmit="handleLogin(event)">
          <div class="input-group">
            <label class="input-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <span>用户名</span>
            </label>
            <input type="text" id="loginUser" class="form-input" placeholder="请输入用户名" required>
          </div>
          <div class="input-group">
            <label class="input-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M18 8h-1V6a6 6 0 00-12 0v2H6c-1.1 0-2 .9-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6a4 4 0 018 0v2z"/>
              </svg>
              <span>密码</span>
            </label>
            <div class="password-box">
              <input type="password" id="loginPass" class="form-input" placeholder="请输入密码" required>
              <button type="button" class="toggle-pass" onclick="togglePassword('loginPass')">
                <svg class="eye" viewBox="0 0 24 24">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="submit-btn">
            <span class="btn-text">登录</span>
            <svg class="btn-arrow" viewBox="0 0 24 24">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231z"/>
            </svg>
          </button>
        </form>

        <form id="formRegister" class="form-panel hidden" onsubmit="handleRegister(event)">
          <div class="input-group">
            <label class="input-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <span>用户名</span>
            </label>
            <input type="text" id="regUser" class="form-input" placeholder="请输入用户名(4-20字符)" required>
          </div>
          <div class="input-group">
            <label class="input-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M18 8h-1V6a6 6 0 00-12 0v2H6c-1.1 0-2 .9-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6a4 4 0 018 0v2z"/>
              </svg>
              <span>密码</span>
            </label>
            <div class="password-box">
              <input type="password" id="regPass" class="form-input" placeholder="请输入密码" required>
              <button type="button" class="toggle-pass" onclick="togglePassword('regPass')">
                <svg class="eye" viewBox="0 0 24 24">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="input-group">
            <label class="input-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
              </svg>
              <span>所在省份</span>
            </label>
            <select id="regProvince" class="form-select" required>
              <option value="">请选择省份</option>
              <option value="北京">北京市</option>
              <option value="天津">天津市</option>
              <option value="河北">河北省</option>
              <option value="山西">山西省</option>
              <option value="内蒙古">内蒙古自治区</option>
              <option value="辽宁">辽宁省</option>
              <option value="吉林">吉林省</option>
              <option value="黑龙江">黑龙江省</option>
              <option value="上海">上海市</option>
              <option value="江苏">江苏省</option>
              <option value="浙江">浙江省</option>
              <option value="安徽">安徽省</option>
              <option value="福建">福建省</option>
              <option value="江西">江西省</option>
              <option value="山东">山东省</option>
              <option value="河南">河南省</option>
              <option value="湖北">湖北省</option>
              <option value="湖南">湖南省</option>
              <option value="广东">广东省</option>
              <option value="广西">广西壮族自治区</option>
              <option value="海南">海南省</option>
              <option value="重庆">重庆市</option>
              <option value="四川">四川省</option>
              <option value="贵州">贵州省</option>
              <option value="云南">云南省</option>
              <option value="西藏">西藏自治区</option>
              <option value="陕西">陕西省</option>
              <option value="甘肃">甘肃省</option>
              <option value="青海">青海省</option>
              <option value="宁夏">宁夏回族自治区</option>
              <option value="新疆">新疆维吾尔自治区</option>
              <option value="台湾">台湾省</option>
              <option value="香港">香港特别行政区</option>
              <option value="澳门">澳门特别行政区</option>
            </select>
          </div>
          <button type="submit" class="submit-btn">
            <span class="btn-text">注册</span>
            <svg class="btn-arrow" viewBox="0 0 24 24">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">益州郡府</span>
        </div>
      </div>
    </header>

    <div class="career-intro">
      <div class="career-badge">📜</div>
      <h1 class="career-title">汉代职场晋升之路</h1>
      <p class="career-subtitle">建元六年，益州郡设郡治，广纳贤才</p>
      <div class="career-story">
        <p>🎭 <strong>角色设定：</strong>你是一名来自中原的年轻士子，听闻益州郡府正在招募贤才。为了在这西南边陲一展抱负，你决定前往应聘。</p>
        <p style="margin-top:8px">🏛️ <strong>考核流程：</strong>太守大人设下三重考验——先过"策问"考校学识，再赴遗址实地勘探，最后修复出土文物。通过全部考核者，方可获得益州郡专属任职文书。</p>
      </div>
    </div>

    <h2 class="section-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8L12 2Z"/>
      </svg>
      晋升之路
    </h2>

    <div class="level-path" id="levelPath">
      <div class="level-card" id="level1Card" onclick="goLevel(1)">
        <div class="level-num">📝</div>
        <div class="level-info">
          <div class="level-name">第一关：入职试炼</div>
          <div class="level-desc">策问考核 · 太守大人考校学识</div>
        </div>
        <div class="level-status" id="level1Status">可进入</div>
      </div>
      <div class="arrow-down">▼</div>
      <div class="level-card locked" id="level2Card" onclick="goLevel(2)">
        <div class="level-num">⛏️</div>
        <div class="level-info">
          <div class="level-name">第二关：实地勘探</div>
          <div class="level-desc">古城遗址 · 寻找前朝官印</div>
        </div>
        <div class="level-status" id="level2Status">未解锁</div>
      </div>
      <div class="arrow-down">▼</div>
      <div class="level-card locked" id="level3Card" onclick="goLevel(3)">
        <div class="level-num">🧩</div>
        <div class="level-info">
          <div class="level-name">第三关：文物修复</div>
          <div class="level-desc">修复残器 · 重现国宝风采</div>
        </div>
        <div class="level-status" id="level3Status">未解锁</div>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startCareerFlow()">开始晋升之路</button>

    <div class="result-preview hidden" id="resultPreview">
      <h3>📋 当前考核进度</h3>
      <div class="result-scores" id="resultScores"></div>
      <button class="action-btn primary" onclick="goCertificate()">查看任职文书</button>
      <button class="action-btn" onclick="resetAll(); location.reload();" style="margin-top:8px">重新考核</button>
    </div>
  </div>

  <script src="js/career.js"></script>
  <script>
    function startCareerFlow() {
      startCareer();
      window.location.href = 'quiz.html';
    }

    function goLevel(level) {
      if (!canPlayLevel(level)) {
        alert('请先完成前一关考核！');
        return;
      }
      var map = { 1: 'quiz.html', 2: 'archaeology.html', 3: 'puzzle.html' };
      window.location.href = map[level];
    }

    function goCertificate() {
      window.location.href = 'certificate.html';
    }

    function resetAll() {
      resetCareer();
    }

    function updateUI() {
      var career = getCareer();
      if (!career) return;

      var allDone = career.level1 && career.level2 && career.level3;
      var btn = document.getElementById('startBtn');

      if (allDone) {
        btn.textContent = '已通关，查看任职文书';
        btn.onclick = goCertificate;
        document.getElementById('resultPreview').classList.remove('hidden');
        var rs = document.getElementById('resultScores');
        rs.innerHTML =
          '<span>策问：' + (career.level1 ? career.level1.score : 0) + '/' + (career.level1 ? career.level1.maxScore : 0) + '</span>' +
          '<span>勘探：' + (career.level2 ? career.level2.score : 0) + '/' + (career.level2 ? career.level2.maxScore : 0) + '</span>' +
          '<span>修复：' + (career.level3 ? career.level3.score : 0) + '/' + (career.level3 ? career.level3.maxScore : 0) + '</span>';
      } else if (career.level1 || career.level2 || career.level3) {
        btn.textContent = '继续考核';
        var next = career.level1 ? (career.level2 ? (career.level3 ? 3 : 3) : 2) : 1;
        btn.onclick = function() { goLevel(next); };
      }

      // Update cards
      [1, 2, 3].forEach(function(l) {
        var card = document.getElementById('level' + l + 'Card');
        var status = document.getElementById('level' + l + 'Status');
        var res = career['level' + l];
        if (res) {
          card.classList.remove('locked');
          card.classList.add('completed');
          status.textContent = res.score + '分';
        } else if (canPlayLevel(l)) {
          card.classList.remove('locked');
          status.textContent = '可进入';
        }
      });
    }

    // 登录注册相关逻辑
    var AUTH_STORAGE = {
      USERS: 'heboUsers',
      CURRENT_USER: 'heboUser'
    };

    function showTab(tab) {
      var tabs = document.querySelectorAll('.tab');
      var loginForm = document.getElementById('formLogin');
      var registerForm = document.getElementById('formRegister');
      tabs.forEach(function(t) { t.classList.remove('active'); });
      if (tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        loginForm.classList.add('active');
        loginForm.classList.remove('hidden');
        registerForm.classList.remove('active');
        registerForm.classList.add('hidden');
      } else {
        document.getElementById('tabRegister').classList.add('active');
        registerForm.classList.add('active');
        registerForm.classList.remove('hidden');
        loginForm.classList.remove('active');
        loginForm.classList.add('hidden');
      }
    }

    function getAuthUsers() {
      var data = localStorage.getItem(AUTH_STORAGE.USERS);
      return data ? JSON.parse(data) : [];
    }

    function saveAuthUsers(users) {
      localStorage.setItem(AUTH_STORAGE.USERS, JSON.stringify(users));
    }

    function togglePassword(fieldId) {
      var field = document.getElementById(fieldId);
      field.type = field.type === 'password' ? 'text' : 'password';
    }

    function handleLogin(event) {
      event.preventDefault();
      var username = document.getElementById('loginUser').value.trim();
      var password = document.getElementById('loginPass').value;
      if (!username || !password) {
        showAuthToast('请填写用户名和密码', 'error');
        return;
      }
      var users = getAuthUsers();
      var user = users.find(function(u) { return u.username === username && u.password === password; });
      if (user) {
        localStorage.setItem(AUTH_STORAGE.CURRENT_USER, JSON.stringify(user));
        showAuthToast('登录成功!', 'success');
        document.getElementById('authOverlay').classList.add('hidden');
        var container = document.querySelector('.container.page');
        if (container) container.classList.remove('hidden');
        updateUI();
      } else {
        showAuthToast('用户名或密码错误', 'error');
      }
    }

    function handleRegister(event) {
      event.preventDefault();
      var username = document.getElementById('regUser').value.trim();
      var password = document.getElementById('regPass').value;
      var province = document.getElementById('regProvince').value;
      if (!username || !password || !province) {
        showAuthToast('请填写所有字段', 'error');
        return;
      }
      if (username.length < 4 || username.length > 20) {
        showAuthToast('用户名需要4-20个字符', 'error');
        return;
      }
      var users = getAuthUsers();
      if (users.find(function(u) { return u.username === username; })) {
        showAuthToast('用户名已存在', 'error');
        return;
      }
      var newUser = {
        id: Date.now(),
        username: username,
        password: password,
        province: province,
        createdAt: new Date().toISOString(),
        score: { archaeology: 0, puzzle: 0, quiz: 0 },
        collectedArtifacts: []
      };
      users.push(newUser);
      saveAuthUsers(users);
      localStorage.setItem(AUTH_STORAGE.CURRENT_USER, JSON.stringify(newUser));
      showAuthToast('注册成功!', 'success');
      document.getElementById('authOverlay').classList.add('hidden');
      var container = document.querySelector('.container.page');
      if (container) container.classList.remove('hidden');
      updateUI();
    }

    function showAuthToast(message, type) {
      var existing = document.querySelector('.toast');
      if (existing) existing.remove();
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + (type || 'info');
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3000);
    }

    function checkAuth() {
      var userData = localStorage.getItem(AUTH_STORAGE.CURRENT_USER);
      var container = document.querySelector('.container.page');
      if (!userData) {
        document.getElementById('authOverlay').classList.remove('hidden');
        if (container) container.classList.add('hidden');
      } else {
        document.getElementById('authOverlay').classList.add('hidden');
        if (container) container.classList.remove('hidden');
        updateUI();
      }
    }

    checkAuth();
  </script>
</body>
</html>
