<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>汉代职场晋升之路 - 益州郡新人报到</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    .career-intro {
      text-align: center;
      padding: 24px 16px;
      background: rgba(61, 50, 40, 0.6);
      border-radius: 16px;
      border: 2px solid var(--primary-bronze);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .career-intro::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,215,0,0.05) 0%, transparent 50%);
      pointer-events: none;
    }
    .career-badge {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .career-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.6rem;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .career-subtitle {
      color: var(--secondary-yellow);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .career-story {
      color: var(--text-primary);
      font-size: 0.9rem;
      line-height: 1.8;
      text-align: left;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .level-path {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .level-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: rgba(61, 50, 40, 0.5);
      border: 2px solid var(--primary-bronze);
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .level-card.locked {
      opacity: 0.5;
      border-color: rgba(139, 105, 20, 0.3);
    }
    .level-card.completed {
      border-color: var(--accent-gold);
      background: rgba(255, 215, 0, 0.05);
    }
    .level-num {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-bronze);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .level-card.completed .level-num {
      background: var(--accent-gold);
      color: #1a0f0a;
    }
    .level-info {
      flex: 1;
      text-align: left;
    }
    .level-name {
      font-size: 1.05rem;
      color: var(--accent-gold);
      font-weight: bold;
    }
    .level-desc {
      font-size: 0.85rem;
      color: var(--secondary-yellow);
      margin-top: 4px;
    }
    .level-status {
      font-size: 0.8rem;
      color: var(--accent-gold);
      text-align: right;
      min-width: 60px;
    }
    .arrow-down {
      text-align: center;
      color: var(--primary-bronze);
      font-size: 1.2rem;
      margin: -4px 0;
    }
    .start-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-family: 'Noto Serif SC', serif;
      background: linear-gradient(145deg, #8B6914 0%, #5c4a32 100%);
      border: 2px solid var(--accent-gold);
      border-radius: 30px;
      color: #FFD700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 16px;
    }
    .start-btn:hover {
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      transform: translateY(-2px);
    }
    .result-preview {
      background: rgba(61, 50, 40, 0.6);
      border: 2px solid var(--accent-gold);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      text-align: center;
    }
    .result-preview h3 {
      color: var(--accent-gold);
      margin-bottom: 12px;
    }
    .result-scores {
      display: flex;
      justify-content: space-around;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .result-scores span {
      color: var(--secondary-yellow);
    }
  </style>
</head>
<body>
  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">益州郡府</span>
        </div>
      </div>
    </header>

    <div class="career-intro">
      <div class="career-badge">📜</div>
      <h1 class="career-title">汉代职场晋升之路</h1>
      <p class="career-subtitle">建元六年，益州郡设郡治，广纳贤才</p>
      <div class="career-story">
        <p>🎭 <strong>角色设定：</strong>你是一名来自中原的年轻士子，听闻益州郡府正在招募贤才。为了在这西南边陲一展抱负，你决定前往应聘。</p>
        <p style="margin-top:8px">🏛️ <strong>考核流程：</strong>太守大人设下三重考验——先过"策问"考校学识，再赴遗址实地勘探，最后修复出土文物。通过全部考核者，方可获得益州郡专属任职文书。</p>
      </div>
    </div>

    <h2 class="section-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8L12 2Z"/>
      </svg>
      晋升之路
    </h2>

    <div class="level-path" id="levelPath">
      <div class="level-card" id="level1Card" onclick="goLevel(1)">
        <div class="level-num">📝</div>
        <div class="level-info">
          <div class="level-name">第一关：入职试炼</div>
          <div class="level-desc">策问考核 · 太守大人考校学识</div>
        </div>
        <div class="level-status" id="level1Status">可进入</div>
      </div>
      <div class="arrow-down">▼</div>
      <div class="level-card locked" id="level2Card" onclick="goLevel(2)">
        <div class="level-num">⛏️</div>
        <div class="level-info">
          <div class="level-name">第二关：实地勘探</div>
          <div class="level-desc">古城遗址 · 寻找前朝官印</div>
        </div>
        <div class="level-status" id="level2Status">未解锁</div>
      </div>
      <div class="arrow-down">▼</div>
      <div class="level-card locked" id="level3Card" onclick="goLevel(3)">
        <div class="level-num">🧩</div>
        <div class="level-info">
          <div class="level-name">第三关：文物修复</div>
          <div class="level-desc">修复残器 · 重现国宝风采</div>
        </div>
        <div class="level-status" id="level3Status">未解锁</div>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startCareerFlow()">开始晋升之路</button>

    <div class="result-preview hidden" id="resultPreview">
      <h3>📋 当前考核进度</h3>
      <div class="result-scores" id="resultScores"></div>
      <button class="action-btn primary" onclick="goCertificate()">查看任职文书</button>
      <button class="action-btn" onclick="resetAll(); location.reload();" style="margin-top:8px">重新考核</button>
    </div>
  </div>

  <script src="js/career.js"></script>
  <script>
    function startCareerFlow() {
      startCareer();
      window.location.href = 'quiz.html';
    }

    function goLevel(level) {
      if (!canPlayLevel(level)) {
        alert('请先完成前一关考核！');
        return;
      }
      var map = { 1: 'quiz.html', 2: 'archaeology.html', 3: 'puzzle.html' };
      window.location.href = map[level];
    }

    function goCertificate() {
      window.location.href = 'certificate.html';
    }

    function resetAll() {
      resetCareer();
    }

    function updateUI() {
      var career = getCareer();
      if (!career) return;

      var allDone = career.level1 && career.level2 && career.level3;
      var btn = document.getElementById('startBtn');

      if (allDone) {
        btn.textContent = '已通关，查看任职文书';
        btn.onclick = goCertificate;
        document.getElementById('resultPreview').classList.remove('hidden');
        var rs = document.getElementById('resultScores');
        rs.innerHTML =
          '<span>策问：' + (career.level1 ? career.level1.score : 0) + '/' + (career.level1 ? career.level1.maxScore : 0) + '</span>' +
          '<span>勘探：' + (career.level2 ? career.level2.score : 0) + '/' + (career.level2 ? career.level2.maxScore : 0) + '</span>' +
          '<span>修复：' + (career.level3 ? career.level3.score : 0) + '/' + (career.level3 ? career.level3.maxScore : 0) + '</span>';
      } else if (career.level1 || career.level2 || career.level3) {
        btn.textContent = '继续考核';
        var next = career.level1 ? (career.level2 ? (career.level3 ? 3 : 3) : 2) : 1;
        btn.onclick = function() { goLevel(next); };
      }

      // Update cards
      [1, 2, 3].forEach(function(l) {
        var card = document.getElementById('level' + l + 'Card');
        var status = document.getElementById('level' + l + 'Status');
        var res = career['level' + l];
        if (res) {
          card.classList.remove('locked');
          card.classList.add('completed');
          status.textContent = res.score + '分';
        } else if (canPlayLevel(l)) {
          card.classList.remove('locked');
          status.textContent = '可进入';
        }
      });
    }

    updateUI();
  </script>
</body>
</html>
