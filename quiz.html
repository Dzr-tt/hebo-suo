<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>古滇知识问答 - 河伯所·古滇探秘</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%238B6914'/%3E%3Cpath d='M50 15 L55 25 L50 35 L45 25 Z' fill='%23FFD700'/%3E%3Ccircle cx='50' cy='55' r='25' fill='none' stroke='%23FFD700' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>
            <circle cx="24" cy="28" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="28" r="4" fill="currentColor"/>
          </svg>
          <span class="logo-text">河伯所</span>
        </div>
        <div class="user-area">
          <button class="user-btn" id="userBtn" onclick="checkLogin()">未登录</button>
        </div>
      </div>
    </header>

    <div class="quiz-container" id="quizContainer">
      <div class="game-header">
        <h1 class="game-title-header">古滇知识问答</h1>
        <div class="game-score">得分: <span id="currentScore">0</span></div>
      </div>

      <div class="quiz-progress" id="quizProgress"></div>

      <div class="quiz-question-card">
        <div class="quiz-timer" id="quizTimer">10</div>
        <p class="quiz-question" id="quizQuestion">题目加载中...</p>
      </div>

      <div class="quiz-options" id="quizOptions">
        <button class="quiz-option" onclick="selectOption(0)">选项 A</button>
        <button class="quiz-option" onclick="selectOption(1)">选项 B</button>
        <button class="quiz-option" onclick="selectOption(2)">选项 C</button>
        <button class="quiz-option" onclick="selectOption(3)">选项 D</button>
      </div>

      <div class="action-bar" style="margin-top: 20px;">
        <button class="action-btn" onclick="showStartScreen()">重新选择题库</button>
      </div>
    </div>

    <div class="quiz-container hidden" id="startScreen">
      <div class="hero" style="text-align: center;">
        <h2 style="font-family: 'Noto Serif SC', serif; font-size: 1.5rem; color: var(--accent-gold); margin-bottom: 16px;">选择题库数量</h2>
        <p style="color: var(--secondary-yellow); margin-bottom: 24px;">测试你对古滇文化的了解程度!</p>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button class="action-btn primary" onclick="startQuiz(5)">🌱 入门 (5题)</button>
          <button class="action-btn" onclick="startQuiz(10)">📚 挑战 (10题)</button>
          <button class="action-btn" onclick="startQuiz(20)">🏆 大师 (20题)</button>
        </div>
      </div>

      <a href="index.html" class="back-link" style="margin-top: 24px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回首页
      </a>
    </div>

    <div class="quiz-container hidden" id="resultScreen">
      <div class="quiz-result">
        <h2 style="font-family: 'Noto Serif SC', serif; font-size: 1.5rem; color: var(--accent-gold); margin-bottom: 24px;">答题完成!</h2>
        <div class="result-score" id="finalScore">0</div>
        <p class="result-message" id="resultMessage">你的古滇文化知识水平:</p>
        <div style="padding: 16px; background: var(--bg-bronze-dark); border-radius: 8px; margin-bottom: 24px;">
          <p style="color: var(--secondary-ivory); font-size: 1.1rem;" id="resultLevel">古滇学徒</p>
        </div>
        <button class="submit-btn" onclick="showStartScreen()">再玩一次</button>
      </div>

      <a href="index.html" class="back-link" style="margin-top: 24px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回首页
      </a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
