<!DOCTYPE html>
<html lang="zh-CN">

  <style>
    .hidden { display: none !important; }
    .hero::before { pointer-events: none !important; }
    .hero::after { pointer-events: none !important; }
  </style>
</head>
<body>
  <div class="container page">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M24 6 L28 14 L24 22 L20 14 Z" fill="currentColor"/>

        </div>
        <button class="user-btn" id="userBtn">登录</button>
      </div>
    </header>

    <!-- 开始界面 -->
    <div class="quiz-container" id="startScreen">
      <div class="hero" style="text-align: center;">
        <h2 style="font-family: 'Noto Serif SC', serif; font-size: 1.5rem; color: var(--accent-gold); margin-bottom: 16px;">📝 入职试炼（策问）</h2>
        <p style="color: var(--secondary-yellow); margin-bottom: 8px;">想要进入益州郡府任职，先要通过"策问"考核！</p>
        <p style="color: var(--secondary-yellow); opacity: 0.8; margin-bottom: 24px; font-size: 0.85rem;">太守大人正在考校你的学识，答对有赏，答错无罚，但时间有限！</p>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button class="action-btn primary" id="btn10">📜 小吏初试 (10题)</button>
          <button class="action-btn" id="btn20">📚 功曹选拔 (20题)</button>
          <button class="action-btn" id="btn30">🏆 太守亲考 (30题)</button>
        </div>
      </div>
      <a href="index.html" class="back-link" style="margin-top: 24px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回郡府
      </a>
    </div>

    <!-- 答题界面 -->
    <div class="quiz-container hidden" id="quizContainer">
      <div class="game-header">
        <h1 class="game-title-header">📝 策问考核</h1>
        <div class="game-score">政绩: <span id="currentScore">0</span></div>
      </div>

      <div class="quiz-progress" id="quizProgress">1 / 10</div>

      <div class="quiz-question-card">
        <div class="quiz-timer" id="quizTimer">10</div>
        <p class="quiz-question" id="quizQuestion">题目加载中...</p>
      </div>

      <div class="quiz-options" id="quizOptions">
        <button class="quiz-option" data-index="0">选项 A</button>
        <button class="quiz-option" data-index="1">选项 B</button>
        <button class="quiz-option" data-index="2">选项 C</button>
        <button class="quiz-option" data-index="3">选项 D</button>
      </div>

      <div class="action-bar" style="margin-top: 20px;">
        <button class="action-btn secondary" id="btnRestart">重新选择题库</button>
      </div>
    </div>

    <!-- 结果界面 -->
    <div class="quiz-container hidden" id="resultScreen">
      <div class="quiz-result">
        <h2 class="result-title">策问考核完毕！</h2>
        <div class="result-score">
          <div class="score-circle" style="border-color: var(--accent-gold); box-shadow: 0 0 30px rgba(255,215,0,0.3);">
            <span id="finalScore">0</span>
            <span class="score-label">分</span>
          </div>
        </div>
        <div class="result-info">
          <p class="result-level" id="resultLevel">🏅 初入仕途</p>
          <p class="result-message" id="resultMessage">恭喜通过策问考核！</p>
        </div>
        <div class="result-stats">
          <span>答对 <span id="correctCount">0</span> 题</span>
          <span>答错 <span id="wrongCount">0</span> 题</span>
        </div>
        <div id="medalBox" style="margin-top: 16px; padding: 12px; background: rgba(255,215,0,0.1); border-radius: 8px; border: 1px solid var(--accent-gold);">
          <div style="font-size: 2rem;">🏅</div>
          <div style="color: var(--accent-gold); font-weight: bold; margin-top: 4px;">获得勋章：初入仕途</div>
          <div style="color: var(--secondary-yellow); font-size: 0.85rem;">益州郡府见习文吏</div>
        </div>
      </div>
      <button class="submit-btn" id="btnNext" style="background: linear-gradient(145deg, #8B6914, #5c4a32); border: 2px solid var(--accent-gold); color: #FFD700; font-family: 'Noto Serif SC', serif;">前往第二关：实地勘探 ➔</button>
      <button class="action-btn" id="btnReplay" style="margin-top: 12px;">重新考核</button>
      <a href="index.html" class="back-link" style="margin-top: 16px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回郡府
      </a>
    </div>
  </div>

      { question: '河泊所文化的酿酒业主要酿造什么酒?', options: ['黄酒', '果酒', '白酒', '米酒'], correct: 3 },
      { question: '河泊所遗址出土的青铜博山炉主要用于?', options: ['熏香', '装饰', '祭祀', '取暖'], correct: 0 },
      { question: '河泊所遗址出土的琥珀饰品主要来自哪里?', options: ['东南亚', '云南本地', '缅甸', '波罗的海'], correct: 2 }
    ];

    let quizState = {
      currentQuestion: 0,
      score: 0,
      totalQuestions: 0,
      questions: [],
      timer: 10,
      timerInterval: null,
      correctCount: 0,
      wrongCount: 0
    };

    function startQuiz(count) {
      quizState.totalQuestions = Math.min(count, QUIZ_QUESTIONS.length);
      quizState.currentQuestion = 0;
      quizState.score = 0;
      quizState.correctCount = 0;
      quizState.wrongCount = 0;
      quizState.startTime = Date.now();

      const shuffled = [...QUIZ_QUESTIONS].sort(() => Math.random() - 0.5);
      quizState.questions = shuffled.slice(0, quizState.totalQuestions);

      document.getElementById('quizContainer').classList.remove('hidden');
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');

      showQuestion();
    }

    function showQuestion() {
      if (quizState.currentQuestion >= quizState.totalQuestions) {
        showResult();
        return;
      }

      const question = quizState.questions[quizState.currentQuestion];
      document.getElementById('quizQuestion').textContent = question.question;

      const options = document.querySelectorAll('.quiz-option');
      options.forEach((option, index) => {
        option.textContent = question.options[index];
        option.classList.remove('correct', 'wrong', 'selected');
        option.disabled = false;
        option.style.pointerEvents = 'auto';
      });

      document.getElementById('currentScore').textContent = quizState.score;
      document.getElementById('quizProgress').textContent = (quizState.currentQuestion + 1) + ' / ' + quizState.totalQuestions;

      startTimer();
    }

    function startTimer() {
      quizState.timer = 10;
      document.getElementById('quizTimer').textContent = quizState.timer;

      if (quizState.timerInterval) {
        clearInterval(quizState.timerInterval);
      }

      quizState.timerInterval = setInterval(function() {
        quizState.timer--;
        document.getElementById('quizTimer').textContent = quizState.timer;

        if (quizState.timer <= 0) {
          clearInterval(quizState.timerInterval);
          quizState.wrongCount++;
          setTimeout(nextQuestion, 1000);
        }
      }, 1000);
    }

    function selectOption(index) {
      if (quizState.timerInterval) {
        clearInterval(quizState.timerInterval);
      }

      const question = quizState.questions[quizState.currentQuestion];
      const options = document.querySelectorAll('.quiz-option');

      options.forEach(function(option, i) {
        option.disabled = true;
        option.style.pointerEvents = 'none';
        if (i === question.correct) {
          option.classList.add('correct');
        } else if (i === index && i !== question.correct) {
          option.classList.add('wrong');
        }
        option.classList.add('selected');
      });

      if (index === question.correct) {
        quizState.score++;
        quizState.correctCount++;
        document.getElementById('currentScore').textContent = quizState.score;
      } else {
        quizState.wrongCount++;
      }

      setTimeout(nextQuestion, 1500);
    }

    function nextQuestion() {
      quizState.currentQuestion++;
      showQuestion();
    }

    function showResult() {
      if (quizState.timerInterval) {
        clearInterval(quizState.timerInterval);
      }

      document.getElementById('finalScore').textContent = quizState.score;
      document.getElementById('correctCount').textContent = quizState.correctCount;
      document.getElementById('wrongCount').textContent = quizState.wrongCount;

      const percentage = (quizState.score / quizState.totalQuestions) * 100;
      let level, message, medalTitle, medalDesc;

      if (percentage >= 90) {
        level = '🏆 益州郡长史';
        message = '才华横溢，太守大人对你赞赏有加！';
        medalTitle = '获得勋章：学贯古今';
        medalDesc = '益州郡长史候选';
      } else if (percentage >= 70) {
        level = '📜 益州郡功曹';
        message = '学识渊博，可堪大任！';
        medalTitle = '获得勋章：满腹经纶';
        medalDesc = '益州郡功曹候选';
      } else if (percentage >= 50) {
        level = '🔍 益州郡书佐';
        message = '基本合格，还需多多历练。';
        medalTitle = '获得勋章：初入仕途';
        medalDesc = '益州郡书佐候补';
      } else {
        level = '🌱 益州郡门吏';
        message = '勉强通过，日后要加倍努力！';
        medalTitle = '获得勋章：初入仕途';
        medalDesc = '益州郡门吏候补';
      }

      document.getElementById('resultLevel').textContent = level;
      document.getElementById('resultMessage').textContent = message;
      document.querySelector('#medalBox div:nth-child(2)').textContent = medalTitle;
      document.querySelector('#medalBox div:nth-child(3)').textContent = medalDesc;

      // Save to career system
      if (typeof saveLevelResult === 'function') {
        var elapsed = quizState.startTime ? (Date.now() - quizState.startTime) : 0;
        saveLevelResult(1, quizState.score, quizState.totalQuestions, elapsed);
      }

      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');
    }

    function showStartScreen() {
      if (quizState.timerInterval) {
        clearInterval(quizState.timerInterval);
      }

      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
      document.getElementById('currentScore').textContent = '0';
    }

    function initQuizEvents() {
      console.log('Quiz events binding...');

      var btn10 = document.getElementById('btn10');
      var btn20 = document.getElementById('btn20');
      var btn30 = document.getElementById('btn30');
      var btnRestart = document.getElementById('btnRestart');
      var btnReplay = document.getElementById('btnReplay');
      var btnNext = document.getElementById('btnNext');

      if (btn10) btn10.addEventListener('click', function() { startQuiz(10); });
      if (btn20) btn20.addEventListener('click', function() { startQuiz(20); });
      if (btn30) btn30.addEventListener('click', function() { startQuiz(30); });
      if (btnRestart) btnRestart.addEventListener('click', showStartScreen);
      if (btnReplay) btnReplay.addEventListener('click', showStartScreen);
      if (btnNext) btnNext.addEventListener('click', function() { window.location.href = 'archaeology.html'; });

      document.querySelectorAll('.quiz-option').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var index = parseInt(this.getAttribute('data-index'));
          selectOption(index);
        });
      });

      console.log('Quiz events bound');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initQuizEvents);
    } else {
      initQuizEvents();
    }
  </script>
</body>
</html>
